<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<title>WORLDVEST</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
  :root {
    --bg-0: #05070d;
    --bg-1: #0a0e1a;
    --line: #1a2238;
    --line-bright: #2a3656;
    --text: #d6e1ff;
    --text-dim: #8a9bc4;
    --text-faint: #5d6e94;
    --header: #b8c8ff;
    --accent: #00ffae;
    --accent-glow: #00ffae40;
    --warn: #ff5277;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    background: var(--bg-0);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    position: relative;
    overflow-x: hidden;
    min-height: 100vh;
    min-height: 100dvh;
  }
  /* Animated grid backdrop */
  body::before {
    content: ""; position: fixed; inset: 0;
    background:
      linear-gradient(rgba(0,255,174,0.035) 1px, transparent 1px) 0 0 / 100% 44px,
      linear-gradient(90deg, rgba(0,255,174,0.035) 1px, transparent 1px) 0 0 / 44px 100%;
    pointer-events: none; z-index: 0; animation: drift 30s linear infinite;
  }
  @keyframes drift { from { background-position: 0 0, 0 0; } to { background-position: 0 44px, 44px 0; } }
  /* Scanline overlay */
  body::after {
    content: ""; position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px,
      transparent 1px, transparent 3px);
    pointer-events: none; mix-blend-mode: overlay; z-index: 1;
  }
  /* Glow blobs */
  .glow {
    position: fixed; width: 900px; height: 900px; border-radius: 50%;
    pointer-events: none; z-index: 0; filter: blur(40px);
  }
  .glow.tl { top: -300px; left: -300px;
             background: radial-gradient(circle, rgba(0,255,174,0.10), transparent 60%); }
  .glow.br { bottom: -400px; right: -300px;
             background: radial-gradient(circle, rgba(74,216,255,0.08), transparent 60%); }

  .page {
    position: relative; z-index: 2;
    max-width: 1100px; margin: 0 auto;
    padding: 60px 32px 80px;
    display: flex; flex-direction: column; gap: 56px;
    min-height: 100vh; min-height: 100dvh;
  }

  /* ========== HERO ========== */
  .hero {
    display: flex; flex-direction: column; align-items: center;
    gap: 18px; padding: 40px 0 8px; text-align: center;
    position: relative;
  }
  .hero .orb {
    width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #00ffae 0%, #00b888 35%, #003c5a 70%, #0a0e1a 100%);
    box-shadow: 0 0 50px var(--accent-glow), inset 0 0 18px rgba(255,255,255,0.4);
    animation: pulseOrb 3s ease-in-out infinite;
    margin-bottom: 6px;
  }
  @keyframes pulseOrb {
    0%,100% { box-shadow: 0 0 50px var(--accent-glow), inset 0 0 18px rgba(255,255,255,0.4); }
    50%     { box-shadow: 0 0 80px var(--accent-glow), inset 0 0 22px rgba(255,255,255,0.5); }
  }
  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(48px, 9vw, 96px);
    letter-spacing: 0.18em;
    margin: 0; line-height: 1;
    text-shadow: 0 0 40px rgba(0,255,174,0.25);
  }
  .hero h1 span { color: var(--accent); }
  .hero .slogan {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(11px, 1.4vw, 14px);
    letter-spacing: 0.4em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }
  /* Decorative divider beneath hero */
  .hero::after {
    content: ""; display: block;
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin-top: 14px;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  /* ========== NEWS SECTION ========== */
  .news {
    border: 1px solid var(--line);
    background: rgba(10,14,26,0.5);
    backdrop-filter: blur(8px);
  }
  .news-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,0.3);
  }
  .news-head .tag {
    font-size: 10px; letter-spacing: 0.3em; color: var(--accent);
    display: inline-flex; align-items: center; gap: 8px;
    text-transform: uppercase;
  }
  .news-head .tag::before {
    content:""; width:6px; height:6px; background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .news-head .updated {
    font-size: 10px; letter-spacing: 0.2em; color: var(--text-faint);
    text-transform: uppercase;
  }

  .news-list { display: flex; flex-direction: column; }

  .news-item {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex; gap: 18px; align-items: flex-start;
    text-decoration: none; color: inherit;
    transition: background .15s;
  }
  .news-item:last-child { border-bottom: none; }
  .news-item:hover { background: rgba(0,255,174,0.04); }
  .news-item .num {
    font-size: 10px; letter-spacing: 0.2em;
    color: var(--text-faint); font-weight: 700;
    min-width: 28px; padding-top: 3px;
  }
  .news-item .thumb {
    width: 88px; height: 64px; flex-shrink: 0;
    background: var(--bg-1);
    border: 1px solid var(--line);
    object-fit: cover;
    display: block;
  }
  .news-item .thumb.hidden { display: none; }
  .news-item .body { flex: 1; min-width: 0; }
  .news-item .headline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px; line-height: 1.4;
    color: var(--text); font-weight: 500;
    margin-bottom: 6px;
  }
  .news-item:hover .headline { color: var(--accent); }
  .news-item .meta {
    display: flex; gap: 12px; align-items: center;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--text-faint);
    text-transform: uppercase;
  }
  .news-item .meta .source { color: var(--text-dim); font-weight: 600; }
  .news-item .meta .dot { width: 3px; height: 3px; background: var(--text-faint); border-radius: 50%; }

  .news-loading, .news-error {
    padding: 40px 20px; text-align: center;
    color: var(--text-faint);
    font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* ========== GATE ========== */
  .gate-section {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 24px 0;
  }
  .gate-section .label {
    font-size: 10px; letter-spacing: 0.4em; color: var(--text-faint);
    text-transform: uppercase;
  }
  .gate-form {
    display: flex; gap: 0;
    width: 100%; max-width: 520px;
    border: 1px solid var(--line);
    background: rgba(10,14,26,0.6);
    backdrop-filter: blur(8px);
    transition: border-color .15s, box-shadow .15s;
  }
  .gate-form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-glow), 0 0 30px rgba(0,255,174,0.15);
  }
  .gate-form.shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .gate-form.error { border-color: var(--warn); }

  #password {
    flex: 1; min-width: 0;
    background: transparent; border: none; outline: none;
    color: var(--text); font-family: inherit;
    font-size: 16px; /* prevents iOS zoom */
    letter-spacing: 0.15em;
    padding: 16px 20px;
    -webkit-appearance: none; appearance: none;
  }
  #password::placeholder {
    color: var(--text-faint); letter-spacing: 0.15em;
    text-transform: uppercase; font-size: 13px;
  }

  .enter-btn {
    background: linear-gradient(180deg, #00ffae 0%, #00b888 100%);
    color: #03130d; font-family: 'JetBrains Mono', monospace;
    font-weight: 700; letter-spacing: 0.25em; font-size: 12px;
    padding: 0 28px; border: none; cursor: pointer;
    transition: filter .15s, box-shadow .15s, transform .1s;
    text-transform: uppercase;
    -webkit-appearance: none; appearance: none; border-radius: 0;
    flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    min-height: 52px;
  }
  .enter-btn:hover { filter: brightness(1.1); box-shadow: 0 0 30px var(--accent-glow); }
  .enter-btn:active { transform: translateY(1px); }
  .enter-btn i { font-size: 11px; }

  .gate-error {
    color: var(--warn); font-size: 10px; letter-spacing: 0.25em;
    text-transform: uppercase; height: 14px;
  }

  /* ========== FOOTER ========== */
  .footer {
    margin-top: auto;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 10px; letter-spacing: 0.25em;
    color: var(--text-faint);
    text-transform: uppercase;
    flex-wrap: wrap; gap: 12px;
  }

  /* ========== MOBILE ========== */
  @media (max-width: 640px) {
    .page { padding: 32px 18px 48px; gap: 36px; }
    .hero { padding: 16px 0 4px; }
    .hero h1 { letter-spacing: 0.12em; }
    .hero .slogan { letter-spacing: 0.3em; }
    .news-head { padding: 12px 14px; }
    .news-item { padding: 14px; gap: 12px; }
    .news-item .num { min-width: 22px; font-size: 9px; }
    .news-item .thumb { width: 64px; height: 48px; }
    .news-item .headline { font-size: 14px; }
    .news-item .meta { font-size: 9px; gap: 8px; flex-wrap: wrap; }
    .gate-form { flex-direction: column; }
    #password { padding: 14px 16px; text-align: center; }
    .enter-btn {
      width: 100%; justify-content: center;
      border-top: 1px solid var(--line);
      min-height: 52px;
    }
    .footer { font-size: 9px; }
  }
</style>
</head>
<body>

<div class="glow tl"></div>
<div class="glow br"></div>

<main class="page">

  <!-- HERO -->
  <section class="hero">
    <div class="orb"></div>
    <h1>WORLD<span>VEST</span></h1>
    <div class="slogan">Global Investing, Redefined</div>
  </section>

  <!-- GATE -->
  <section class="gate-section">
    <div class="label">Members Access</div>
    <form class="gate-form" id="gate-form" onsubmit="return submitGate(event)" autocomplete="off">
      <input type="password" id="password" placeholder="Enter password"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <button type="submit" class="enter-btn">
        Enter Watchlist <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>
    <div class="gate-error" id="gate-error">&nbsp;</div>
  </section>

  <!-- NEWS -->
  <section class="news">
    <div class="news-head">
      <span class="tag">Today's Markets</span>
      <span class="updated" id="news-updated">—</span>
    </div>
    <div class="news-list" id="news-list">
      <div class="news-loading">Loading market headlines…</div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <span>© WorldVest 2026</span>
    <span></span>
  </footer>

</main>

<script>
  // ============ FIREBASE + ANONYMOUS AUTH ============
  // We sign in anonymously on every page load so Firebase's security rules
  // can require auth. The user sees nothing — it just happens.
  const firebaseConfig = {
    apiKey: "AIzaSyBZar3sZBOEe__EGqh_IqTszD8CzeKJYYY",
    authDomain: "watchlist-d9ade.firebaseapp.com",
    projectId: "watchlist-d9ade",
    storageBucket: "watchlist-d9ade.firebasestorage.app",
    messagingSenderId: "927853955548",
    appId: "1:927853955548:web:dedd485e291d3804542719",
    measurementId: "G-9QNQ8ZVLSR"
  };
  firebase.initializeApp(firebaseConfig);
  firebase.auth().signInAnonymously().catch(err => {
    console.warn('anonymous auth failed:', err);
  });

  // ============ CONFIG ============
  // Finnhub key for news (public-side use; same key already in your watchlist).
  const FINNHUB_KEY = "d7ok9vhr01qsb7bf9bdgd7ok9vhr01qsb7bf9be0";

  // Password gate. The check uses a SHA-256 hash so the plain-text password
  // is NOT visible in this file's source.
  //
  // To set/change the password:
  //   1. Open browser console on this page and run:
  //        await sha256("YOUR_PASSWORD_HERE")
  //   2. Copy the resulting hex string
  //   3. Paste it as the value of PASSWORD_HASH below
  //
  // Default placeholder hash below = the word "changeme" (so the page still
  // works on first deploy). Replace it with your own hash before going live.
  const PASSWORD_HASH = "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08";

  // localStorage key for "remember me"
  const UNLOCK_KEY = "worldvest_unlocked";

  // ============ AUTO-UNLOCK ============
  // If the user has unlocked before, send them straight through.
  if (localStorage.getItem(UNLOCK_KEY) === "true") {
    // Replace, not push, so back-button doesn't bring them back to the gate.
    window.location.replace("watchlist.html");
  }

  // ============ HELPERS ============
  async function sha256(text) {
    const buf = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  // Expose for one-time password setup from console
  window.sha256 = sha256;

  // ============ GATE ============
  async function submitGate(e) {
    e.preventDefault();
    const input = document.getElementById('password');
    const form = document.getElementById('gate-form');
    const errorEl = document.getElementById('gate-error');
    const value = input.value.trim();
    if (!value) return false;

    const hash = await sha256(value);
    if (hash === PASSWORD_HASH) {
      localStorage.setItem(UNLOCK_KEY, "true");
      window.location.href = "watchlist.html";
    } else {
      form.classList.add('shake', 'error');
      errorEl.textContent = "Incorrect password";
      input.value = '';
      setTimeout(() => {
        form.classList.remove('shake', 'error');
        errorEl.innerHTML = '&nbsp;';
      }, 2000);
    }
    return false;
  }

  // ============ NEWS ============
  // Landing page shows general market headlines only.
  async function loadNews() {
    const listEl = document.getElementById('news-list');
    const updatedEl = document.getElementById('news-updated');
    try {
      const res = await fetch(`https://finnhub.io/api/v1/news?category=general&token=${FINNHUB_KEY}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const items = await res.json();
      const top = (items || [])
        .filter(it => it.headline && it.headline.trim().length > 0)
        .slice(0, 5);

      if (top.length === 0) {
        listEl.innerHTML = '<div class="news-error">No headlines available right now.</div>';
        return;
      }

      const safe = s => String(s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
      const ago = sec => {
        if (!sec) return '';
        const diff = Math.floor(Date.now()/1000 - sec);
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff/60) + 'm ago';
        if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
        return Math.floor(diff/86400) + 'd ago';
      };

      listEl.innerHTML = top.map((it, i) => `
        <a class="news-item" href="${safe(it.url)}" target="_blank" rel="noopener noreferrer">
          <div class="num">${String(i+1).padStart(2,'0')}</div>
          <div class="body">
            <div class="headline">${safe(it.headline)}</div>
            <div class="meta">
              <span class="source">${safe(it.source || 'Source')}</span>
              <span class="dot"></span>
              <span>${ago(it.datetime)}</span>
            </div>
          </div>
        </a>
      `).join('');

      const now = new Date();
      updatedEl.textContent = 'Updated ' + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    } catch (e) {
      console.warn('news load failed:', e);
      listEl.innerHTML = '<div class="news-error">Couldn\'t load headlines. Try refreshing.</div>';
    }
  }

  loadNews();
  // Refresh news every 5 minutes if the tab stays open
  setInterval(loadNews, 5 * 60 * 1000);
  // And refresh on tab refocus
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') loadNews();
  });
</script>
</body>
</html>
