<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldVest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body class="min-h-screen text-white bg-slate-950">

  <div class="p-8 max-w-4xl mx-auto">
    <div class="flex items-center gap-4 mb-8">
      <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-cyan-500 rounded-full flex items-center justify-center text-4xl">🌐</div>
      <h1 class="text-5xl font-bold">WorldVest</h1>
    </div>

    <div class="mb-8">
      <input id="search" placeholder="Add ticker (AAPL, BTC...)" 
             class="bg-slate-900 border border-slate-700 rounded-3xl px-6 py-4 w-full max-w-md text-lg"
             onkeyup="if(event.key==='Enter') addCurrentStock()">
      <button onclick="addCurrentStock()" class="ml-4 bg-emerald-600 px-8 py-4 rounded-3xl">ADD</button>
    </div>

    <div class="mt-8">
      <h2 class="text-2xl mb-4">Watchlist</h2>
      <div id="watchlist-body" class="space-y-4"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBZar3sZBOEe__EGqh_IqTszD8CzeKJYYY",
      authDomain: "watchlist-d9ade.firebaseapp.com",
      projectId: "watchlist-d9ade",
      storageBucket: "watchlist-d9ade.firebasestorage.app",
      messagingSenderId: "927853955548",
      appId: "1:927853955548:web:dedd485e291d3804542719",
      measurementId: "G-9QNQ8ZVLSR"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ================== PUT YOUR FINNHUB KEY HERE ==================
    const FINNHUB_KEY = "d7ok9vhr01qsb7bf9bdgd7ok9vhr01qsb7bf9be0";
    // ==============================================================

    function renderWatchlist() {
      const container = document.getElementById('watchlist-body');
      container.innerHTML = '<p class="text-slate-400">Loading data...</p>';

      db.ref('watchlist').once('value', (snap) => {
        const watchlist = snap.val() || {};

        db.ref('prices').once('value', (priceSnap) => {
          const prices = priceSnap.val() || {};

          container.innerHTML = '';

          if (Object.keys(watchlist).length === 0) {
            container.innerHTML = '<p class="text-slate-400">No tickers added yet. Use the search bar above.</p>';
            return;
          }

          Object.keys(watchlist).forEach(symbol => {
            const price = prices[symbol] ? prices[symbol].price.toFixed(2) : '—';
            const div = document.createElement('div');
            div.className = "bg-slate-900 p-6 rounded-2xl flex justify-between items-center";
            div.innerHTML = `
              <span class="font-bold text-2xl">${symbol}</span>
              <span class="font-mono text-3xl ${price === '—' ? 'text-slate-400' : 'text-emerald-400'}">${price}</span>
              <button onclick="deleteTicker('${symbol}')" class="text-red-400 text-2xl px-3">🗑</button>
            `;
            container.appendChild(div);
          });
        });
      });
    }

    function deleteTicker(symbol) {
      if (confirm(`Remove ${symbol} from watchlist?`)) {
        db.ref('watchlist/' + symbol).remove();
      }
    }

    function addCurrentStock() {
      const symbol = document.getElementById('search').value.trim().toUpperCase();
      if (symbol) {
        db.ref('watchlist/' + symbol).set({ symbol: symbol, addedAt: Date.now() });
        document.getElementById('search').value = '';
      }
    }

    // Start the app
    window.onload = () => {
      console.log("🚀 WorldVest Debug Mode Started");
      renderWatchlist();
      db.ref('watchlist').on('value', renderWatchlist);
      db.ref('prices').on('value', renderWatchlist);
    };
  </script>
</body>
</html>
