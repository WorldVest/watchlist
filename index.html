<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldVest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  
  <style>
    body { background: linear-gradient(135deg, #0b1429 0%, #1a2a4a 100%); }
    .tech-earth { width: 62px; height: 62px; background: radial-gradient(circle at 38% 38%, #10f0a0 12%, #0ba5ff 48%, #1e3a8a 85%); border-radius: 9999px; box-shadow: 0 0 60px #10f0a0, inset 0 0 40px rgba(255,255,255,0.35); }
  </style>
</head>
<body class="min-h-screen text-white">

  <!-- LOGIN -->
  <div id="login-page" class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <div class="tech-earth mx-auto mb-8"></div>
      <h1 class="text-7xl font-bold tracking-tighter">WorldVest</h1>
      <p class="text-emerald-400 text-2xl mt-2">PRIVATE WATCHLIST</p>

      <div class="max-w-sm mx-auto mt-12">
        <input id="password-input" 
               type="password" 
               placeholder="Password"
               class="w-full bg-slate-950 border border-slate-700 rounded-3xl px-10 py-6 text-xl text-center"
               onkeypress="if(event.key === 'Enter') checkPassword()">
        
        <button onclick="checkPassword()" 
                class="mt-8 w-full bg-gradient-to-r from-emerald-500 to-cyan-500 py-6 rounded-3xl text-2xl font-medium">
          ENTER
        </button>
        
        <p id="error-msg" class="text-red-400 mt-6 hidden">Incorrect password</p>
      </div>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="main-dashboard" class="hidden flex h-screen">
    <!-- Chat -->
    <div class="w-[520px] border-r border-slate-700 bg-slate-950 flex flex-col">
      <div class="p-6 border-b border-slate-700 font-semibold text-lg flex items-center gap-3">
        <i class="fa-solid fa-comments text-emerald-400"></i> Chat
      </div>
      <div id="chat-messages" class="flex-1 p-6 overflow-auto space-y-5 text-sm"></div>
      
      <div class="p-5 border-t border-slate-700 bg-slate-900">
        <input id="username" placeholder="Your display name" class="w-full mb-3 bg-slate-950 border border-slate-700 rounded-2xl px-5 py-3 text-sm">
        <div class="flex gap-3">
          <input id="chat-input" type="text" placeholder="Share a trade idea..." 
                 class="flex-1 bg-slate-950 border border-slate-700 rounded-3xl px-6 py-4 outline-none focus:border-emerald-400"
                 onkeypress="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()" class="bg-emerald-500 px-8 rounded-3xl font-medium">Send</button>
        </div>
      </div>
    </div>

    <!-- Watchlist -->
    <div class="flex-1 flex flex-col">
      <div class="h-16 border-b border-slate-700 bg-slate-950 flex items-center px-8 gap-6">
        <div class="flex items-center gap-4">
          <div class="tech-earth"></div>
          <h1 class="text-3xl font-bold tracking-tighter">WorldVest</h1>
        </div>
        
        <div class="flex-1">
          <input id="search" placeholder="Add ticker or crypto (AAPL, BTC...)" 
                 class="w-full bg-slate-900 border border-slate-700 rounded-3xl px-6 py-3 outline-none focus:border-emerald-400"
                 onkeypress="if(event.key==='Enter') addStock()">
        </div>
        <button onclick="addStock()" class="bg-emerald-500 px-8 py-3 rounded-3xl font-medium whitespace-nowrap">ADD TO LIST</button>
      </div>

      <div class="flex-1 overflow-auto p-8">
        <table class="w-full">
          <thead>
            <tr class="text-xs uppercase tracking-widest text-slate-400 border-b border-slate-700">
              <th class="pb-6 text-left">Asset</th>
              <th class="pb-6 text-right">Price</th>
              <th class="pb-6 text-right">1D</th>
              <th class="pb-6 text-right">1M</th>
              <th class="pb-6 text-right">Mar 30th</th>
              <th class="pb-6 text-right">YTD</th>
            </tr>
          </thead>
          <tbody id="watchlist-body" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBZar3sZBOEe__EGqh_IqTszD8CzeKJYYY",
      authDomain: "watchlist-d9ade.firebaseapp.com",
      projectId: "watchlist-d9ade",
      storageBucket: "watchlist-d9ade.firebasestorage.app",
      messagingSenderId: "927853955548",
      appId: "1:927853955548:web:dedd485e291d3804542719",
      measurementId: "G-9QNQ8ZVLSR"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const PASSWORD = "giddyup";

    function checkPassword() {
      const input = document.getElementById('password-input').value.trim();
      if (input.toLowerCase() === PASSWORD) {
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('main-dashboard').classList.remove('hidden');
        initRealtime();
      } else {
        document.getElementById('error-msg').classList.remove('hidden');
      }
    }

    function initRealtime() {
      document.getElementById('username').value = localStorage.getItem('username') || '';

      // Real-time Chat
      db.ref('chat').limitToLast(50).on('child_added', (snapshot) => {
        const msg = snapshot.val();
        const chatDiv = document.getElementById('chat-messages');
        const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        
        chatDiv.innerHTML += `
          <div class="flex gap-3">
            <div class="text-emerald-400 font-medium min-w-[110px]">${msg.name}</div>
            <div class="flex-1">${msg.message}</div>
            <div class="text-xs text-slate-500 whitespace-nowrap">${time}</div>
          </div>`;
        chatDiv.scrollTop = chatDiv.scrollHeight;
      });

      // Real-time Watchlist
      db.ref('watchlist').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const tbody = document.getElementById('watchlist-body');
        tbody.innerHTML = '';

        Object.keys(data).forEach(symbol => {
          const row = document.createElement('tr');
          row.className = 'hover:bg-slate-800/70 transition';
          row.innerHTML = `
            <td class="py-6 pl-4 font-bold text-xl">${symbol}</td>
            <td class="py-6 text-right font-mono text-2xl text-emerald-400">—</td>
            <td class="py-6 text-right text-emerald-400">—</td>
            <td class="py-6 text-right text-emerald-400">—</td>
            <td class="py-6 text-right text-emerald-400">—</td>
            <td class="py-6 text-right text-emerald-400">—</td>
          `;
          tbody.appendChild(row);
        });
      });
    }

    function addStock() {
      const symbol = document.getElementById('search').value.trim().toUpperCase();
      if (!symbol) return;
      
      db.ref('watchlist/' + symbol).set({
        symbol: symbol,
        addedAt: Date.now()
      });
      document.getElementById('search').value = '';
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const nameInput = document.getElementById('username');
      if (!input.value.trim()) return;

      db.ref('chat').push({
        name: nameInput.value.trim() || "Anonymous",
        message: input.value.trim(),
        timestamp: Date.now()
      });
      
      localStorage.setItem('username', nameInput.value.trim());
      input.value = '';
    }
  </script>
</body>
</html>
