<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldVest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  
  <style>
    body { background: linear-gradient(135deg, #0b1429 0%, #1a2a4a 100%); }
    .tech-earth { width: 62px; height: 62px; background: radial-gradient(circle at 38% 38%, #10f0a0 12%, #0ba5ff 48%, #1e3a8a 85%); border-radius: 9999px; box-shadow: 0 0 60px #10f0a0, inset 0 0 40px rgba(255,255,255,0.35); }
  </style>
</head>
<body class="min-h-screen text-white">

  <!-- MAIN DASHBOARD -->
  <div class="flex h-screen">
    <!-- Chat -->
    <div class="w-[500px] border-r border-slate-700 bg-slate-950 flex flex-col">
      <div class="p-6 border-b border-slate-700 font-semibold text-lg flex items-center gap-3">
        <i class="fa-solid fa-comments text-emerald-400"></i> Chat
      </div>
      <div id="chat-messages" class="flex-1 p-6 overflow-auto space-y-4 text-sm"></div>
      
      <div class="p-5 border-t border-slate-700 bg-slate-900">
        <input id="username" placeholder="Your display name" class="w-full mb-3 bg-slate-950 border border-slate-700 rounded-2xl px-5 py-3 text-sm">
        <div class="flex gap-3">
          <input id="chat-input" type="text" placeholder="Share a trade idea..." 
                 class="flex-1 bg-slate-950 border border-slate-700 rounded-3xl px-6 py-4 outline-none focus:border-emerald-400"
                 onkeypress="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()" class="bg-emerald-500 px-8 rounded-3xl font-medium">Send</button>
        </div>
      </div>
    </div>

    <!-- Watchlist -->
    <div class="flex-1 flex flex-col">
      <div class="h-16 border-b border-slate-700 bg-slate-950 flex items-center px-8 gap-6">
        <div class="flex items-center gap-4">
          <div class="tech-earth"></div>
          <h1 class="text-3xl font-bold tracking-tighter">WorldVest</h1>
        </div>
        
        <div class="flex-1 relative">
          <input id="search" placeholder="Search & add ticker (AAPL, BTC...)" 
                 class="w-full bg-slate-900 border border-slate-700 rounded-3xl px-6 py-3 outline-none focus:border-emerald-400"
                 onkeyup="handleSearchInput()">
          <div id="suggestions" class="absolute mt-2 w-full bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl max-h-80 overflow-auto hidden z-50"></div>
        </div>
        <button onclick="addCurrentStock()" class="bg-emerald-500 px-8 py-3 rounded-3xl font-medium">ADD TO LIST</button>
      </div>

      <div class="flex-1 overflow-auto p-8">
        <table class="w-full">
          <thead>
            <tr class="text-xs uppercase tracking-widest text-slate-400 border-b border-slate-700">
              <th class="pb-6 text-left">Asset</th>
              <th class="pb-6 text-right">Price</th>
              <th class="pb-6 text-right">1D</th>
              <th class="pb-6 text-right">1M</th>
              <th class="pb-6 text-right">Mar 30th</th>
              <th class="pb-6 text-right">YTD</th>
              <th class="pb-6 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="watchlist-body" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBZar3sZBOEe__EGqh_IqTszD8CzeKJYYY",
      authDomain: "watchlist-d9ade.firebaseapp.com",
      projectId: "watchlist-d9ade",
      storageBucket: "watchlist-d9ade.firebasestorage.app",
      messagingSenderId: "927853955548",
      appId: "1:927853955548:web:dedd485e291d3804542719",
      measurementId: "G-9QNQ8ZVLSR"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const FINNHUB_KEY = "d7ok9vhr01qsb7bf9bdgd7ok9vhr01qsb7bf9be0";   // ←←← PUT YOUR REAL KEY HERE

    function initApp() {
      // Live Watchlist + Prices
      db.ref('watchlist').on('value', renderWatchlist);
      db.ref('prices').on('value', renderWatchlist);

      // Chat
      db.ref('chat').limitToLast(100).on('child_added', (snapshot) => {
        const msg = snapshot.val();
        const chatDiv = document.getElementById('chat-messages');
        const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        chatDiv.innerHTML += `<div class="flex gap-3"><div class="text-emerald-400 font-medium min-w-[110px]">${msg.name}</div><div>${msg.message}</div><div class="text-xs text-slate-500">${time}</div></div>`;
        chatDiv.scrollTop = chatDiv.scrollHeight;
      });
    }

    function renderWatchlist() {
      const tbody = document.getElementById('watchlist-body');
      tbody.innerHTML = '';

      db.ref('watchlist').once('value', (snap) => {
        const watchlist = snap.val() || {};
        db.ref('prices').once('value', (priceSnap) => {
          const prices = priceSnap.val() || {};

          Object.keys(watchlist).forEach(symbol => {
            const price = prices[symbol] ? prices[symbol].price.toFixed(2) : '—';
            const row = document.createElement('tr');
            row.innerHTML = `
              <td class="py-6 pl-4 font-bold text-xl">${symbol}</td>
              <td class="py-6 text-right font-mono text-2xl">${price}</td>
              <td class="py-6 text-right text-emerald-400">—</td>
              <td class="py-6 text-right text-emerald-400">—</td>
              <td class="py-6 text-right text-emerald-400">—</td>
              <td class="py-6 text-right text-emerald-400">—</td>
              <td class="py-6 text-right">
                <button onclick="deleteTicker('${symbol}')" class="text-red-400 hover:text-red-500">🗑</button>
              </td>
            `;
            tbody.appendChild(row);
          });
        });
      });
    }

    function deleteTicker(symbol) {
      if (confirm(`Remove ${symbol}?`)) db.ref('watchlist/' + symbol).remove();
    }

    function addCurrentStock() {
      const symbol = document.getElementById('search').value.trim().toUpperCase();
      if (symbol) {
        db.ref('watchlist/' + symbol).set({ symbol: symbol, addedAt: Date.now() });
        document.getElementById('search').value = '';
        document.getElementById('suggestions').classList.add('hidden');
      }
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const nameInput = document.getElementById('username');
      if (!input.value.trim()) return;

      db.ref('chat').push({
        name: nameInput.value.trim() || "Anonymous",
        message: input.value.trim(),
        timestamp: Date.now()
      });
      input.value = '';
    }

    // Search Bar
    async function handleSearchInput() {
      const query = document.getElementById('search').value.trim();
      const box = document.getElementById('suggestions');
      if (query.length < 2) { box.classList.add('hidden'); return; }

      try {
        const res = await fetch(`https://finnhub.io/api/v1/search?q=${query}&token=${FINNHUB_KEY}`);
        const data = await res.json();
        let html = '';
        (data.result || []).slice(0,10).forEach(item => {
          html += `<div onclick="selectSuggestion('${item.symbol}')" class="px-6 py-4 hover:bg-slate-800 cursor-pointer border-b border-slate-700">${item.symbol} <span class="text-slate-400">• ${item.description}</span></div>`;
        });
        box.innerHTML = html;
        box.classList.remove('hidden');
      } catch(e) {}
    }

    function selectSuggestion(symbol) {
      document.getElementById('search').value = symbol;
      document.getElementById('suggestions').classList.add('hidden');
    }

    // Start the app
    window.onload = initApp;
  </script>
</body>
</html>
