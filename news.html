<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<title>WORLDVEST · NEWSFEED</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
  :root {
    --bg-0: #05070d; --bg-1: #0a0e1a;
    --line: #1a2238; --line-bright: #2a3656;
    --text: #d6e1ff; --text-dim: #8a9bc4; --text-faint: #5d6e94;
    --header: #b8c8ff;
    --accent: #00ffae; --accent-glow: #00ffae40;
    --warn: #ff5277; --gold: #f7b955;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  body {
    background: var(--bg-0); color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px; position: relative;
    overflow-x: hidden;
    min-height: 100vh; min-height: 100dvh;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background:
      linear-gradient(rgba(0,255,174,0.035) 1px, transparent 1px) 0 0 / 100% 44px,
      linear-gradient(90deg, rgba(0,255,174,0.035) 1px, transparent 1px) 0 0 / 44px 100%;
    pointer-events: none; z-index: 0; animation: drift 30s linear infinite;
  }
  @keyframes drift { from { background-position: 0 0, 0 0; } to { background-position: 0 44px, 44px 0; } }
  body::after {
    content: ""; position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px,
      transparent 1px, transparent 3px);
    pointer-events: none; mix-blend-mode: overlay; z-index: 1;
  }
  .glow {
    position: fixed; width: 900px; height: 900px; border-radius: 50%;
    pointer-events: none; z-index: 0; filter: blur(40px);
  }
  .glow.tl { top: -300px; left: -300px;
             background: radial-gradient(circle, rgba(0,255,174,0.10), transparent 60%); }
  .glow.br { bottom: -400px; right: -300px;
             background: radial-gradient(circle, rgba(74,216,255,0.08), transparent 60%); }

  /* TOP BAR (matches watchlist) */
  .topbar {
    position: relative; z-index: 2;
    height: 56px;
    border-bottom: 1px solid var(--line);
    background: rgba(5,7,13,0.85); backdrop-filter: blur(8px);
    display: flex; align-items: center; padding: 0 20px; gap: 22px;
  }
  .topbar::after {
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.4;
  }
  .brand { display: flex; align-items: center; gap: 12px;
           font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.18em; }
  .brand .orb {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 30% 30%, #00ffae 0%, #00b888 35%, #003c5a 70%, #0a0e1a 100%);
    box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px rgba(255,255,255,0.4);
    animation: pulseOrb 3s ease-in-out infinite;
  }
  @keyframes pulseOrb {
    0%,100% { box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px rgba(255,255,255,0.4); }
    50%     { box-shadow: 0 0 36px var(--accent-glow), inset 0 0 14px rgba(255,255,255,0.5); }
  }
  .brand .name { font-weight: 700; font-size: 18px; }
  .brand .name span { color: var(--accent); }
  .brand-right { margin-left: auto; }

  .nav-link {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 16px;
    letter-spacing: 0.18em; color: var(--text-dim);
    text-decoration: none; padding: 6px 14px;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    white-space: nowrap;
  }
  .nav-link span { color: var(--accent); }
  .nav-link:hover { color: var(--text); border-color: var(--line-bright); background: rgba(0,255,174,0.04); }
  .nav-link.active { color: var(--text); border-color: var(--accent); background: rgba(0,255,174,0.06); }

  .lock-btn {
    background: transparent; border: 1px solid var(--line-bright);
    color: var(--text-faint); font-size: 12px;
    padding: 6px 10px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
    -webkit-appearance: none; appearance: none; border-radius: 0;
    margin-left: 12px;
  }
  .lock-btn:hover {
    color: var(--accent); border-color: var(--accent);
    background: rgba(0,255,174,0.06);
  }

  /* MAIN CONTENT */
  .page {
    position: relative; z-index: 2;
    max-width: 1100px; margin: 0 auto;
    padding: 32px 24px 60px;
    display: flex; flex-direction: column; gap: 28px;
  }

  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .section-head .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .section-head .label::before {
    content:""; width: 6px; height: 6px;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .section-head .updated {
    font-size: 10px; letter-spacing: 0.2em;
    color: var(--text-faint);
    text-transform: uppercase;
  }

  .news-list {
    display: flex; flex-direction: column;
    border: 1px solid var(--line);
    background: rgba(10,14,26,0.5);
    backdrop-filter: blur(8px);
  }

  .news-item {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    display: flex; gap: 18px; align-items: flex-start;
    text-decoration: none; color: inherit;
    transition: background .15s;
  }
  .news-item:last-child { border-bottom: none; }
  .news-item:hover { background: rgba(0,255,174,0.04); }
  .news-item .num {
    font-size: 11px; letter-spacing: 0.2em;
    color: var(--text-faint); font-weight: 700;
    min-width: 30px; padding-top: 4px;
  }
  .news-item .thumb {
    width: 110px; height: 76px; flex-shrink: 0;
    background: var(--bg-1); border: 1px solid var(--line);
    object-fit: cover; display: block;
  }
  .news-item .thumb.hidden { display: none; }
  .news-item .body { flex: 1; min-width: 0; }
  .news-item .ticker-tag {
    display: inline-block;
    font-size: 9px; letter-spacing: 0.2em;
    color: var(--gold);
    border: 1px solid rgba(247,185,85,0.3);
    padding: 2px 8px; margin-bottom: 8px;
    text-transform: uppercase;
  }
  .news-item .ticker-tag.stock {
    color: var(--accent);
    border-color: rgba(0,255,174,0.3);
  }
  .news-item .headline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; line-height: 1.45;
    color: var(--text); font-weight: 500;
    margin-bottom: 8px;
  }
  .news-item:hover .headline { color: var(--accent); }
  .news-item .summary {
    font-size: 12px; line-height: 1.55;
    color: var(--text-dim); margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-item .meta {
    display: flex; gap: 12px; align-items: center;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--text-faint); text-transform: uppercase;
  }
  .news-item .meta .source { color: var(--text-dim); font-weight: 600; }
  .news-item .meta .dot { width: 3px; height: 3px; background: var(--text-faint); border-radius: 50%; }

  .empty-state, .loading {
    padding: 60px 20px; text-align: center;
    color: var(--text-faint);
    font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* MOBILE */
  @media (max-width: 768px) {
    .topbar { padding: 0 12px; gap: 10px; height: 50px; }
    .brand .name { font-size: 15px; letter-spacing: 0.12em; }
    .brand .orb { width: 22px; height: 22px; }
    .nav-link { font-size: 13px; padding: 4px 10px; letter-spacing: 0.12em; }
    .lock-btn { padding: 5px 8px; font-size: 11px; margin-left: 8px; }

    .page { padding: 20px 14px 40px; gap: 24px; }
    .news-item { padding: 14px; gap: 12px; }
    .news-item .num { min-width: 22px; font-size: 9px; }
    .news-item .thumb { width: 70px; height: 52px; }
    .news-item .headline { font-size: 14px; }
    .news-item .summary { display: none; }
    .news-item .meta { font-size: 9px; gap: 8px; flex-wrap: wrap; }
  }
  @media (max-width: 380px) {
    .brand-right { display: none; }
  }
</style>
</head>
<body>

<div class="glow tl"></div>
<div class="glow br"></div>

<header class="topbar">
  <a href="watchlist.html" class="brand" style="text-decoration: none; color: inherit;">
    <div class="orb"></div>
    <div><div class="name">WORLD<span>VEST</span></div></div>
  </a>
  <a class="nav-link active" href="news.html">NEWS<span>FEED</span></a>
  <a class="brand brand-right" style="text-decoration: none; color: inherit;" href="watchlist.html">
    <div class="name">WATCH<span>LIST</span></div>
  </a>
  <button class="lock-btn" onclick="logout()" title="Sign out"><i class="fa-solid fa-lock"></i></button>
</header>

<main class="page">

  <section>
    <div class="section-head">
      <span class="label">Today's Markets</span>
      <span class="updated" id="general-updated">—</span>
    </div>
    <div class="news-list" id="general-list">
      <div class="loading">Loading market headlines…</div>
    </div>
  </section>

  <section>
    <div class="section-head">
      <span class="label">Your Watchlist</span>
      <span class="updated" id="watchlist-updated">—</span>
    </div>
    <div class="news-list" id="watchlist-list">
      <div class="loading">Loading watchlist news…</div>
    </div>
  </section>

</main>

<script>
  // ============ GATE CHECK ============
  if (localStorage.getItem("worldvest_unlocked") !== "true") {
    window.location.replace("index.html");
  }

  // ============ CONFIG ============
  const firebaseConfig = {
    apiKey: "AIzaSyBZar3sZBOEe__EGqh_IqTszD8CzeKJYYY",
    authDomain: "watchlist-d9ade.firebaseapp.com",
    projectId: "watchlist-d9ade",
    storageBucket: "watchlist-d9ade.firebasestorage.app",
    messagingSenderId: "927853955548",
    appId: "1:927853955548:web:dedd485e291d3804542719",
    measurementId: "G-9QNQ8ZVLSR"
  };
  const FINNHUB_KEY = "d7ok9vhr01qsb7bf9bdgd7ok9vhr01qsb7bf9be0";

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Sign in anonymously so Firebase rules requiring auth allow our reads.
  firebase.auth().signInAnonymously().catch(err => {
    console.warn('anonymous auth failed:', err);
  });

  // ============ HELPERS ============
  const safe = s => String(s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const ago = sec => {
    if (!sec) return '';
    const diff = Math.floor(Date.now()/1000 - sec);
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff/60) + 'm ago';
    if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
    return Math.floor(diff/86400) + 'd ago';
  };
  const fmtUpdated = () => {
    const now = new Date();
    return 'Updated ' + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  };
  function isCrypto(symbol) {
    return symbol.startsWith('CG:') || symbol.includes(':');
  }

  function logout() {
    if (!confirm('Sign out and return to the landing page?')) return;
    localStorage.removeItem('worldvest_unlocked');
    window.location.replace('index.html');
  }

  function renderItem(it, idx, tickerLabel) {
    const tag = tickerLabel
      ? `<div class="ticker-tag stock">${safe(tickerLabel)}</div>`
      : '';
    const summary = it.summary && it.summary.length > 30
      ? `<div class="summary">${safe(it.summary)}</div>`
      : '';
    return `
      <a class="news-item" href="${safe(it.url)}" target="_blank" rel="noopener noreferrer">
        <div class="num">${String(idx+1).padStart(2,'0')}</div>
        <div class="body">
          ${tag}
          <div class="headline">${safe(it.headline)}</div>
          ${summary}
          <div class="meta">
            <span class="source">${safe(it.source || 'Source')}</span>
            <span class="dot"></span>
            <span>${ago(it.datetime)}</span>
          </div>
        </div>
      </a>
    `;
  }

  // ============ GENERAL MARKET NEWS ============
  async function loadGeneralNews() {
    const listEl = document.getElementById('general-list');
    try {
      const res = await fetch(`https://finnhub.io/api/v1/news?category=general&token=${FINNHUB_KEY}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const items = await res.json();
      const top = (items || [])
        .filter(it => it.headline && it.headline.trim().length > 0)
        .slice(0, 8); // grab top 8 for the general section
      if (top.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No headlines available.</div>';
        return;
      }
      listEl.innerHTML = top.map((it, i) => renderItem(it, i)).join('');
      document.getElementById('general-updated').textContent = fmtUpdated();
    } catch (e) {
      console.warn('general news failed:', e);
      listEl.innerHTML = '<div class="empty-state">Couldn\'t load headlines.</div>';
    }
  }

  // ============ WATCHLIST-SPECIFIC NEWS ============
  // Pull stock symbols from /watchlist in Firebase, then fetch /company-news
  // for each. Crypto symbols are skipped — Finnhub's company-news endpoint
  // is stocks-only.
  async function loadWatchlistNews() {
    const listEl = document.getElementById('watchlist-list');
    try {
      const snap = await db.ref('watchlist').once('value');
      const data = snap.val() || {};
      const stockSyms = Object.keys(data).filter(s => !isCrypto(s));

      if (stockSyms.length === 0) {
        listEl.innerHTML = '<div class="empty-state">Add a stock to your watchlist to see related news here.</div>';
        return;
      }

      // Date range: last 7 days
      const today = new Date();
      const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
      const fmt = d => d.toISOString().slice(0,10);
      const fromDate = fmt(weekAgo);
      const toDate = fmt(today);

      // Fetch news for each stock symbol in parallel
      const results = await Promise.all(stockSyms.map(async sym => {
        try {
          const url = `https://finnhub.io/api/v1/company-news?symbol=${encodeURIComponent(sym)}&from=${fromDate}&to=${toDate}&token=${FINNHUB_KEY}`;
          const res = await fetch(url);
          if (!res.ok) return { sym, items: [] };
          const items = await res.json();
          // Take the most recent item with a headline
          const top = (items || [])
            .filter(it => it.headline && it.headline.trim().length > 0)
            .sort((a, b) => (b.datetime || 0) - (a.datetime || 0))
            .slice(0, 2); // up to 2 per ticker
          return { sym, items: top };
        } catch (e) {
          return { sym, items: [] };
        }
      }));

      // Flatten, attach ticker tag, sort by recency, take top 8
      const flat = [];
      for (const { sym, items } of results) {
        for (const it of items) flat.push({ ...it, _sym: sym });
      }
      flat.sort((a, b) => (b.datetime || 0) - (a.datetime || 0));
      const top = flat.slice(0, 8);

      if (top.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No recent news for your watchlist stocks.</div>';
        return;
      }
      listEl.innerHTML = top.map((it, i) => renderItem(it, i, it._sym)).join('');
      document.getElementById('watchlist-updated').textContent = fmtUpdated();
    } catch (e) {
      console.warn('watchlist news failed:', e);
      listEl.innerHTML = '<div class="empty-state">Couldn\'t load watchlist news.</div>';
    }
  }

  // ============ BOOT ============
  loadGeneralNews();
  loadWatchlistNews();

  // Refresh every 5 minutes
  setInterval(() => { loadGeneralNews(); loadWatchlistNews(); }, 5 * 60 * 1000);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      loadGeneralNews();
      loadWatchlistNews();
    }
  });
</script>
</body>
</html>
