<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<title>WORLDVEST · AGENTCHAT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
  :root {
    --bg-0: #05070d; --bg-1: #0a0e1a;
    --line: #1a2238; --line-bright: #2a3656;
    --text: #d6e1ff; --text-dim: #8a9bc4; --text-faint: #5d6e94;
    --header: #b8c8ff;
    --accent: #00ffae; --accent-glow: #00ffae40;
    --warn: #ff5277; --gold: #f7b955;
    --agent-purple: #a78bff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg-0); color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px; position: relative;
    overflow-x: hidden;
    min-height: 100vh; min-height: 100dvh;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background:
      linear-gradient(rgba(0,255,174,0.035) 1px, transparent 1px) 0 0 / 100% 44px,
      linear-gradient(90deg, rgba(0,255,174,0.035) 1px, transparent 1px) 0 0 / 44px 100%;
    pointer-events: none; z-index: 0; animation: drift 30s linear infinite;
  }
  @keyframes drift { from { background-position: 0 0, 0 0; } to { background-position: 0 44px, 44px 0; } }
  body::after {
    content: ""; position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px,
      transparent 1px, transparent 3px);
    pointer-events: none; mix-blend-mode: overlay; z-index: 1;
  }
  .glow {
    position: fixed; width: 900px; height: 900px; border-radius: 50%;
    pointer-events: none; z-index: 0; filter: blur(40px);
  }
  .glow.tl { top: -300px; left: -300px;
             background: radial-gradient(circle, rgba(0,255,174,0.10), transparent 60%); }
  .glow.br { bottom: -400px; right: -300px;
             background: radial-gradient(circle, rgba(167,139,255,0.08), transparent 60%); }

  /* TOP BAR */
  .topbar {
    position: relative; z-index: 2; height: 56px;
    border-bottom: 1px solid var(--line);
    background: rgba(5,7,13,0.85); backdrop-filter: blur(8px);
    display: flex; align-items: center; padding: 0 20px; gap: 22px;
  }
  .topbar::after {
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.4;
  }
  .brand { display: flex; align-items: center; gap: 12px;
           font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.18em;
           text-decoration: none; color: inherit; }
  .brand .orb {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 30% 30%, #00ffae 0%, #00b888 35%, #003c5a 70%, #0a0e1a 100%);
    box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px rgba(255,255,255,0.4);
    animation: pulseOrb 3s ease-in-out infinite;
  }
  @keyframes pulseOrb {
    0%,100% { box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px rgba(255,255,255,0.4); }
    50%     { box-shadow: 0 0 36px var(--accent-glow), inset 0 0 14px rgba(255,255,255,0.5); }
  }
  .brand .name { font-weight: 700; font-size: 18px; }
  .brand .name span { color: var(--accent); }
  .brand-right { margin-left: auto; }

  .nav-link {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 16px;
    letter-spacing: 0.18em; color: var(--text-dim);
    text-decoration: none; padding: 6px 14px;
    border: 1px solid transparent;
    transition: color .15s, border-color .15s, background .15s;
    white-space: nowrap;
  }
  .nav-link span { color: var(--accent); }
  .nav-link:hover { color: var(--text); border-color: var(--line-bright); background: rgba(0,255,174,0.04); }
  .nav-link.active { color: var(--text); border-color: var(--accent); background: rgba(0,255,174,0.06); }

  .lock-btn {
    background: transparent; border: 1px solid var(--line-bright);
    color: var(--text-faint); font-size: 12px;
    padding: 6px 10px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
    -webkit-appearance: none; appearance: none; border-radius: 0;
    margin-left: 12px;
  }
  .lock-btn:hover {
    color: var(--accent); border-color: var(--accent);
    background: rgba(0,255,174,0.06);
  }

  /* PAGE LAYOUT */
  .page {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    height: calc(100vh - 56px); height: calc(100dvh - 56px);
    max-width: 900px; margin: 0 auto;
    padding: 24px 24px 0;
    width: 100%;
  }

  .header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .header .label {
    font-size: 11px; letter-spacing: 0.3em;
    color: var(--agent-purple);
    text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .header .label::before {
    content:""; width: 6px; height: 6px;
    background: var(--agent-purple);
    box-shadow: 0 0 8px var(--agent-purple);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .header .clear-btn {
    background: transparent; border: 1px solid var(--line-bright);
    color: var(--text-faint); font-family: inherit;
    font-size: 10px; letter-spacing: 0.2em;
    padding: 6px 12px; cursor: pointer;
    text-transform: uppercase;
    transition: color .15s, border-color .15s;
  }
  .header .clear-btn:hover { color: var(--warn); border-color: var(--warn); }

  /* CONVERSATION */
  .convo {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
    padding: 4px 4px 18px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; scrollbar-color: var(--line-bright) transparent;
  }
  .convo::-webkit-scrollbar { width: 6px; }
  .convo::-webkit-scrollbar-thumb { background: var(--line-bright); border-radius: 3px; }

  .msg {
    display: flex; gap: 14px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform:none; } }
  .msg .avatar {
    width: 32px; height: 32px; flex-shrink: 0;
    border: 1px solid var(--line-bright);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em;
  }
  .msg.user .avatar { color: var(--accent); border-color: rgba(0,255,174,0.3); }
  .msg.agent .avatar { color: var(--agent-purple); border-color: rgba(167,139,255,0.3); }
  .msg .body {
    flex: 1; min-width: 0;
    border-left: 2px solid var(--line-bright);
    padding: 4px 0 4px 14px;
  }
  .msg.user .body { border-left-color: rgba(0,255,174,0.3); }
  .msg.agent .body { border-left-color: rgba(167,139,255,0.3); }
  .msg .who {
    font-size: 10px; letter-spacing: 0.2em;
    color: var(--text-faint); text-transform: uppercase;
    margin-bottom: 6px; font-weight: 600;
  }
  .msg.user .who { color: var(--accent); }
  .msg.agent .who { color: var(--agent-purple); }
  .msg .text {
    font-size: 14px; line-height: 1.6;
    color: var(--text); word-break: break-word;
    white-space: pre-wrap;
  }
  .msg .text strong { color: var(--text); font-weight: 700; }
  .msg .text code {
    background: var(--bg-1); border: 1px solid var(--line);
    padding: 1px 6px; font-size: 12px;
    color: var(--accent);
  }
  .msg .tool-calls {
    margin-top: 8px;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--text-faint); text-transform: uppercase;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .msg .tool-pill {
    border: 1px solid var(--line-bright);
    padding: 2px 8px;
    color: var(--text-faint);
  }

  /* TYPING INDICATOR */
  .typing { display: inline-flex; gap: 4px; align-items: center; height: 22px; }
  .typing .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--agent-purple);
    animation: bounce 1.4s ease-in-out infinite;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  /* SUGGESTIONS */
  .suggestions {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin: 18px 0 0;
  }
  .suggestion-btn {
    background: transparent;
    border: 1px solid var(--line-bright);
    color: var(--text-dim);
    font-family: inherit; font-size: 12px;
    padding: 8px 14px; cursor: pointer;
    text-align: left;
    transition: color .15s, border-color .15s, background .15s;
    -webkit-appearance: none; appearance: none; border-radius: 0;
  }
  .suggestion-btn:hover {
    color: var(--text);
    border-color: var(--agent-purple);
    background: rgba(167,139,255,0.06);
  }

  /* INPUT */
  .composer {
    border-top: 1px solid var(--line);
    padding: 16px 0 16px;
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--bg-0);
  }
  .composer textarea {
    flex: 1; min-width: 0;
    background: var(--bg-1);
    border: 1px solid var(--line);
    color: var(--text); font-family: inherit;
    font-size: 16px; /* prevents iOS zoom */
    padding: 12px 16px;
    outline: none; resize: none;
    transition: border-color .15s, box-shadow .15s;
    -webkit-appearance: none; appearance: none; border-radius: 0;
    line-height: 1.4; max-height: 140px;
  }
  .composer textarea:focus {
    border-color: var(--agent-purple);
    box-shadow: 0 0 0 1px rgba(167,139,255,0.4), 0 0 18px rgba(167,139,255,0.15);
  }
  .composer textarea::placeholder { color: var(--text-faint); }
  .send-btn {
    background: linear-gradient(180deg, #a78bff 0%, #7e5fff 100%);
    color: #1a0d3a; font-family: inherit;
    font-weight: 700; letter-spacing: 0.2em; font-size: 11px;
    padding: 0 20px; border: none; cursor: pointer;
    transition: filter .15s, box-shadow .15s, transform .1s, opacity .15s;
    text-transform: uppercase;
    -webkit-appearance: none; appearance: none; border-radius: 0;
    flex-shrink: 0; min-height: 48px;
  }
  .send-btn:hover { filter: brightness(1.1); box-shadow: 0 0 24px rgba(167,139,255,0.3); }
  .send-btn:active { transform: translateY(1px); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; box-shadow: none; }

  .disclaimer {
    text-align: center; padding: 8px 0 16px;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--text-faint); text-transform: uppercase;
  }

  /* MOBILE */
  @media (max-width: 768px) {
    .topbar { padding: 0 12px; gap: 10px; height: 50px; }
    .brand .name { font-size: 15px; letter-spacing: 0.12em; }
    .brand .orb { width: 22px; height: 22px; }
    .nav-link { font-size: 13px; padding: 4px 10px; letter-spacing: 0.12em; }
    .lock-btn { padding: 5px 8px; font-size: 11px; margin-left: 8px; }

    .page {
      padding: 14px 14px 0;
      height: calc(100vh - 50px); height: calc(100dvh - 50px);
    }
    .header { margin-bottom: 12px; padding-bottom: 10px; }
    .msg .text { font-size: 14px; }
    .composer { padding: 12px 0; }
    .send-btn { padding: 0 16px; }
  }
  @media (max-width: 380px) {
    .brand-right { display: none; }
  }
</style>
</head>
<body>

<div class="glow tl"></div>
<div class="glow br"></div>

<header class="topbar">
  <a class="brand" href="watchlist.html">
    <div class="orb"></div>
    <div><div class="name">WORLD<span>VEST</span></div></div>
  </a>
  <a class="nav-link" href="news.html">NEWS<span>FEED</span></a>
  <a class="nav-link active" href="agent.html">AGENT<span>CHAT</span></a>
  <a class="brand brand-right" href="watchlist.html">
    <div class="name">WATCH<span>LIST</span></div>
  </a>
  <button class="lock-btn" onclick="logout()" title="Sign out"><i class="fa-solid fa-lock"></i></button>
</header>

<main class="page">
  <div class="header">
    <span class="label">AGENT · Powered by Gemini</span>
    <button class="clear-btn" onclick="clearConvo()">Clear chat</button>
  </div>

  <div class="convo" id="convo">
    <!-- messages render here -->
  </div>

  <div class="composer">
    <textarea id="input" placeholder="Ask about markets, your watchlist, or anything finance…"
              rows="1" onkeydown="onKeyDown(event)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">SEND</button>
  </div>

  <div class="disclaimer">For information only · Not financial advice</div>
</main>

<script>
  // ============ GATE CHECK ============
  if (localStorage.getItem("worldvest_unlocked") !== "true") {
    window.location.replace("index.html");
  }

  // ============ CONFIG ============
  // The agent runs server-side on Render. The browser just sends user
  // messages here and gets back the agent's reply. The Gemini API key
  // never touches the browser.
  //
  // Replace this with your Render service URL (the one you visit to keep
  // it warm with UptimeRobot — same URL).
  const AGENT_URL = "https://worldvest-updater.onrender.com/agent";

  const firebaseConfig = {
    apiKey: "AIzaSyBZar3sZBOEe__EGqh_IqTszD8CzeKJYYY",
    authDomain: "watchlist-d9ade.firebaseapp.com",
    projectId: "watchlist-d9ade",
    storageBucket: "watchlist-d9ade.firebasestorage.app",
    messagingSenderId: "927853955548",
    appId: "1:927853955548:web:dedd485e291d3804542719",
    measurementId: "G-9QNQ8ZVLSR"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  firebase.auth().signInAnonymously().catch(err => console.warn('auth failed:', err));

  const CONVO_KEY = "worldvest_agent_convo_v1";

  // ============ AGENT TURN — calls Render proxy ============
  // We send the conversation history + new user message; the server runs
  // Gemini, executes any tools, and returns the final text + tool list.
  async function agentTurn(userText, onUpdate) {
    convo.push({ role: 'user', parts: [{ text: userText }] });

    // Build a clean history for the server: only user/model text turns,
    // never tool plumbing. Drop the message we just added (the server
    // takes that as a separate `message` field).
    const history = convo.slice(0, -1)
      .filter(m => {
        const hasFnCall = m.parts?.some(p => p.functionCall);
        const hasFnResp = m.parts?.some(p => p.functionResponse);
        return !hasFnCall && !hasFnResp;
      })
      .map(m => ({
        role: m.role,
        parts: (m.parts || []).filter(p => p.text).map(p => ({ text: p.text })),
      }))
      .filter(m => m.parts.length > 0);

    const res = await fetch(AGENT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history, message: userText }),
    });

    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).error || ''; } catch (_) {}
      const err = new Error(`Server ${res.status}${detail ? ': ' + detail : ''}`);
      err.status = res.status;
      throw err;
    }

    const data = await res.json();
    const tools = data.tools || [];
    if (tools.length && onUpdate) {
      // Show all tools used in one go so the typing indicator reflects what happened
      onUpdate({ tools });
    }
    const text = data.text || '(No response from agent.)';
    convo.push({ role: 'model', parts: [{ text }] });
    return { text, tools };
  }

  // ============ STATE & PERSISTENCE ============
  let convo = [];

  function loadConvo() {
    try {
      const stored = localStorage.getItem(CONVO_KEY);
      if (stored) convo = JSON.parse(stored);
    } catch (e) { convo = []; }
  }
  function saveConvo() {
    try {
      // Cap at last 30 messages so localStorage doesn't bloat
      if (convo.length > 60) convo = convo.slice(-60);
      localStorage.setItem(CONVO_KEY, JSON.stringify(convo));
    } catch (e) { /* ignore */ }
  }
  function clearConvo() {
    if (!confirm('Clear the conversation? This cannot be undone.')) return;
    convo = [];
    saveConvo();
    renderConvo();
  }

  // ============ RENDERING ============
  const safe = s => String(s||'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

  // Tiny markdown-ish: **bold**, `code`
  function renderText(t) {
    return safe(t)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function renderConvo() {
    const box = document.getElementById('convo');
    if (convo.length === 0) {
      box.innerHTML = `
        <div class="msg agent">
          <div class="avatar">AI</div>
          <div class="body">
            <div class="who">Agent</div>
            <div class="text">Hi — I'm your WorldVest market agent. I can pull live prices for anything on your watchlist, fetch market news, and explain what's going on. What would you like to know?</div>
          </div>
        </div>
        <div class="suggestions">
          <button class="suggestion-btn" onclick="useSuggestion('How is my watchlist performing today?')">How is my watchlist performing today?</button>
          <button class="suggestion-btn" onclick="useSuggestion('Give me a 30-second recap of today\\'s market news')">30-second market recap</button>
          <button class="suggestion-btn" onclick="useSuggestion('What is a P/E ratio?')">What is a P/E ratio?</button>
          <button class="suggestion-btn" onclick="useSuggestion('Any big news on NVDA this week?')">Any big news on NVDA this week?</button>
        </div>`;
      return;
    }
    let html = '';
    for (const m of convo) {
      // Skip tool-call/tool-response messages from display (internal plumbing)
      const hasFunctionCall = m.parts?.some(p => p.functionCall);
      const hasFunctionResponse = m.parts?.some(p => p.functionResponse);
      if (hasFunctionCall || hasFunctionResponse) continue;

      const text = (m.parts || []).map(p => p.text || '').join('').trim();
      if (!text) continue;

      const isUser = m.role === 'user';
      html += `
        <div class="msg ${isUser ? 'user' : 'agent'}">
          <div class="avatar">${isUser ? 'YOU' : 'AI'}</div>
          <div class="body">
            <div class="who">${isUser ? 'You' : 'Agent'}</div>
            <div class="text">${renderText(text)}</div>
          </div>
        </div>`;
    }
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
  }

  function showTyping(toolNames) {
    const box = document.getElementById('convo');
    const existing = document.getElementById('typing-row');
    const toolsHtml = toolNames && toolNames.length
      ? `<div class="tool-calls">${toolNames.map(t => `<span class="tool-pill">${safe(t.replace('_', ' '))}</span>`).join('')}</div>`
      : '';
    const row = `
      <div class="msg agent" id="typing-row">
        <div class="avatar">AI</div>
        <div class="body">
          <div class="who">Agent</div>
          <div class="text"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
          ${toolsHtml}
        </div>
      </div>`;
    if (existing) existing.outerHTML = row;
    else box.insertAdjacentHTML('beforeend', row);
    box.scrollTop = box.scrollHeight;
  }
  function hideTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  // ============ SEND ============
  let sending = false;
  async function sendMessage() {
    if (sending) return;
    const inputEl = document.getElementById('input');
    const text = inputEl.value.trim();
    if (!text) return;

    sending = true;
    document.getElementById('send-btn').disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    // Render user message immediately
    convo.push({ role: 'user', parts: [{ text }] });
    renderConvo();
    showTyping([]);

    // Pop the user message we just added — agentTurn will re-add it.
    convo.pop();

    try {
      await agentTurn(text, ({ tools }) => {
        showTyping(tools || []);
      });
      hideTyping();
      saveConvo();
      renderConvo();
    } catch (e) {
      hideTyping();
      console.error(e);
      let friendly = `Sorry, I hit an error: ${e.message}`;
      if (e.status === 429 || /rate|quota|429/i.test(e.message)) {
        friendly = "I'm being rate-limited. The free Gemini tier allows about 10 requests per minute and 250 per day. Wait a minute and try again. Daily limit resets at midnight Pacific time.";
      } else if (e.status === 503 || /not configured/i.test(e.message)) {
        friendly = "The agent isn't configured yet. The Gemini API key needs to be set in the Render service environment variables.";
      } else if (/failed to fetch|network/i.test(e.message)) {
        friendly = "Couldn't reach the agent server. The Render service might be cold-starting (gives it ~30 seconds), or there's a network issue. Try again shortly.";
      }
      convo.push({ role: 'model', parts: [{ text: friendly }] });
      saveConvo();
      renderConvo();
    } finally {
      sending = false;
      document.getElementById('send-btn').disabled = false;
      inputEl.focus();
    }
  }

  function useSuggestion(text) {
    const inputEl = document.getElementById('input');
    inputEl.value = text;
    sendMessage();
  }

  // ============ INPUT HANDLING ============
  function onKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }
  // Auto-resize textarea
  document.getElementById('input').addEventListener('input', e => {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px';
  });

  function logout() {
    if (!confirm('Sign out and return to the landing page?')) return;
    localStorage.removeItem('worldvest_unlocked');
    window.location.replace('index.html');
  }

  // ============ BOOT ============
  loadConvo();
  renderConvo();
</script>
</body>
</html>
