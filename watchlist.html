<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<title>WORLDVEST</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
  :root {
    --bg-0: #05070d;
    --bg-1: #0a0e1a;
    --line: #1a2238;
    --line-bright: #2a3656;
    --text: #d6e1ff;
    --text-dim: #8a9bc4;
    --text-faint: #5d6e94;
    --header: #b8c8ff;
    --accent: #00ffae;
    --accent-glow: #00ffae40;
    --warn: #ff5277;
    --gold: #f7b955;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    background: var(--bg-0);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    overflow: hidden;
    position: relative;
  }

  /* Animated grid + scanlines */
  body::before {
    content: ""; position: fixed; inset: 0;
    background:
      linear-gradient(rgba(0,255,174,0.035) 1px, transparent 1px) 0 0 / 100% 44px,
      linear-gradient(90deg, rgba(0,255,174,0.035) 1px, transparent 1px) 0 0 / 44px 100%;
    pointer-events: none; z-index: 0; animation: drift 30s linear infinite;
  }
  @keyframes drift { from { background-position: 0 0, 0 0; } to { background-position: 0 44px, 44px 0; } }
  body::after {
    content: ""; position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px,
      transparent 1px, transparent 3px);
    pointer-events: none; mix-blend-mode: overlay; z-index: 1;
  }
  .glow { position: fixed; width: 900px; height: 900px; border-radius: 50%;
          pointer-events: none; z-index: 0; filter: blur(40px); }
  .glow.tl { top: -300px; left: -300px;
             background: radial-gradient(circle, rgba(0,255,174,0.10), transparent 60%); }
  .glow.br { bottom: -400px; right: -300px;
             background: radial-gradient(circle, rgba(74,216,255,0.08), transparent 60%); }

  /* ============ APP LAYOUT ============ */
  .app {
    position: relative; z-index: 2;
    display: grid;
    grid-template-columns: 33fr 67fr;
    grid-template-rows: 56px 1fr;
    height: 100vh; height: 100dvh;
  }

  /* TOP BAR */
  .topbar {
    grid-column: 1 / -1;
    border-bottom: 1px solid var(--line);
    background: rgba(5,7,13,0.85);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; padding: 0 20px; gap: 22px;
    position: relative;
  }
  .topbar::after {
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.4;
  }

  .brand { display: flex; align-items: center; gap: 12px;
           font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.18em;
           text-decoration: none; color: inherit; }
  .brand .orb {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 30% 30%, #00ffae 0%, #00b888 35%, #003c5a 70%, #0a0e1a 100%);
    box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px rgba(255,255,255,0.4);
    animation: pulseOrb 3s ease-in-out infinite;
  }
  @keyframes pulseOrb {
    0%,100% { box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px rgba(255,255,255,0.4); }
    50%     { box-shadow: 0 0 36px var(--accent-glow), inset 0 0 14px rgba(255,255,255,0.5); }
  }
  .brand .name { font-weight: 700; font-size: 18px; }
  .brand .name span { color: var(--accent); }

  .top-stats {
    display: flex; gap: 28px; margin-left: 8px;
    border-left: 1px solid var(--line); padding-left: 24px;
  }
  .stat { display: flex; flex-direction: column; gap: 2px;
          font-size: 10px; letter-spacing: 0.2em; color: var(--text-dim); }
  .stat b { font-size: 13px; letter-spacing: 0.05em; color: var(--text); font-weight: 600; }
  .stat .live { color: var(--accent); }
  .stat .live::before {
    content:""; display:inline-block; width:6px; height:6px; border-radius:50%;
    background: var(--accent); margin-right:6px; transform: translateY(-2px);
    box-shadow: 0 0 8px var(--accent); animation: blink 1.4s ease-in-out infinite;
  }
  .stat .live.stale { color: var(--warn); }
  .stat .live.stale::before { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* Right cluster: toggle button + brand wordmark + lock */
  .right-cluster {
    margin-left: auto;
    display: flex; align-items: center; gap: 14px;
  }
  .toggle-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 16px;
    letter-spacing: 0.18em; color: var(--text-dim);
    text-decoration: none; padding: 6px 14px;
    border: 1px solid var(--line-bright);
    background: transparent; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
    white-space: nowrap;
    -webkit-appearance: none; appearance: none; border-radius: 0;
  }
  .toggle-btn span { color: var(--accent); }
  .toggle-btn:hover {
    color: var(--text); border-color: var(--accent);
    background: rgba(0,255,174,0.06);
  }

  .lock-btn {
    background: transparent; border: 1px solid var(--line-bright);
    color: var(--text-faint); font-size: 12px;
    padding: 6px 10px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
    -webkit-appearance: none; appearance: none; border-radius: 0;
  }
  .lock-btn:hover {
    color: var(--accent); border-color: var(--accent);
    background: rgba(0,255,174,0.06);
  }

  /* ============ CHAT (left) — always visible ============ */
  .chat {
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(10,14,26,0.7) 0%, rgba(5,7,13,0.95) 100%);
    display: flex; flex-direction: column; min-height: 0;
  }
  .panel-head {
    height: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    font-size: 10px; letter-spacing: 0.3em; color: var(--text-dim);
    background: rgba(0,0,0,0.3);
  }
  .panel-head .tag { color: var(--accent); display: inline-flex; align-items: center; gap: 8px; }
  .panel-head .tag::before {
    content:""; width:6px; height:6px; background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .messages {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; scrollbar-color: var(--line-bright) transparent;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--line-bright); border-radius: 3px; }

  .msg {
    border-left: 2px solid var(--line-bright); padding: 8px 0 8px 14px;
    animation: fadeIn 0.4s ease; position: relative; padding-right: 28px;
  }
  .msg .h { display: flex; gap: 12px; align-items: baseline;
            font-size: 12px; letter-spacing: 0.12em; color: var(--text-faint);
            margin-bottom: 5px; }
  .msg .h .who { color: var(--accent); font-weight: 600; }
  .msg .body { font-size: 15px; color: var(--text); line-height: 1.55; word-break: break-word; }
  .msg .x {
    position: absolute; top: 6px; right: 4px;
    background: transparent; border: none; cursor: pointer;
    color: var(--text-faint); font-size: 12px; padding: 4px 6px;
    opacity: 0; transition: opacity .15s, color .15s;
    font-family: inherit;
  }
  .msg:hover .x { opacity: 1; }
  .msg .x:hover { color: var(--warn); }
  @keyframes fadeIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform:none; } }

  .composer {
    border-top: 1px solid var(--line); padding: 14px;
    background: rgba(0,0,0,0.4);
    display: flex; flex-direction: column; gap: 10px;
  }
  .composer input {
    width: 100%; background: var(--bg-1); border: 1px solid var(--line);
    color: var(--text); font-family: inherit; font-size: 16px;
    padding: 10px 14px; outline: none;
    transition: border-color .15s, box-shadow .15s;
    -webkit-appearance: none; appearance: none; border-radius: 0;
  }
  .composer input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-glow), 0 0 18px rgba(0,255,174,0.15);
  }
  .composer .row { display: flex; gap: 10px; }
  .composer .row input { flex: 1; min-width: 0; }
  .btn {
    background: linear-gradient(180deg, #00ffae 0%, #00b888 100%);
    color: #03130d; font-family: 'JetBrains Mono', monospace;
    font-weight: 700; letter-spacing: 0.2em; font-size: 11px;
    padding: 0 18px; border: none; cursor: pointer;
    transition: transform .1s, box-shadow .15s, filter .15s;
    text-transform: uppercase;
    -webkit-appearance: none; appearance: none; border-radius: 0;
    flex-shrink: 0; min-height: 44px;
  }
  .btn:hover { box-shadow: 0 0 24px var(--accent-glow); filter: brightness(1.1); }
  .btn:active { transform: translateY(1px); }

  /* ============ MAIN (right) — watchlist OR news view ============ */
  .main {
    display: flex; flex-direction: column; min-height: 0;
    background: radial-gradient(ellipse at top, rgba(0,255,174,0.04), transparent 60%), var(--bg-0);
  }

  /* Toolbar (only visible on watchlist view) */
  .toolbar {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 24px; border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,0.3);
  }
  .toolbar.hidden { display: none; }

  .search-wrap { flex: 1; position: relative; min-width: 0; }
  .search-wrap .icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-faint); font-size: 12px; pointer-events: none;
  }
  .search-wrap input {
    width: 100%; background: var(--bg-1); border: 1px solid var(--line);
    color: var(--text); font-family: inherit; font-size: 16px;
    padding: 11px 14px 11px 38px; outline: none; letter-spacing: 0.05em;
    -webkit-appearance: none; appearance: none; border-radius: 0;
  }
  .search-wrap input::placeholder { color: var(--text-faint); letter-spacing: 0.1em; font-size: 14px; }
  .search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-glow), 0 0 18px rgba(0,255,174,0.15);
  }
  #suggestions {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--bg-1); border: 1px solid var(--line-bright);
    max-height: 380px; overflow-y: auto; z-index: 100;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    -webkit-overflow-scrolling: touch;
  }
  #suggestions.hidden { display: none; }
  .sug-section {
    font-size: 9px; letter-spacing: 0.3em; color: var(--text-faint);
    padding: 10px 16px 6px; text-transform: uppercase;
    background: rgba(0,0,0,0.3);
  }
  .sug {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    cursor: pointer; font-size: 13px; display: flex; gap: 12px; align-items: center;
    transition: background .1s;
  }
  .sug:hover, .sug:active { background: rgba(0,255,174,0.08); }
  .sug img.logo { width: 22px; height: 22px; border-radius: 50%;
                  background: var(--bg-0); object-fit: cover; flex-shrink: 0; }
  .sug .sym { color: var(--accent); font-weight: 700; min-width: 90px; }
  .sug.crypto .sym { color: var(--gold); }
  .sug .desc { color: var(--text-dim); flex:1; min-width: 0;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sug .pill {
    font-size: 9px; letter-spacing: 0.15em; padding: 2px 6px;
    border: 1px solid var(--line-bright); color: var(--text-faint); flex-shrink: 0;
  }
  .sug.crypto .pill { color: var(--gold); border-color: rgba(247,185,85,0.3); }

  /* Watchlist table */
  .view { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }
  .view.hidden { display: none; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0;
    background: rgba(5,7,13,0.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line-bright);
    text-align: right; padding: 14px 16px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.22em;
    color: var(--header);
    text-shadow: 0 0 12px rgba(184,200,255,0.25);
    text-transform: uppercase; z-index: 5;
    white-space: nowrap;
  }
  thead th:first-child { text-align: left; padding-left: 24px; }
  thead th:last-child { text-align: right; padding-right: 24px; }

  tbody tr {
    border-bottom: 1px solid var(--line);
    transition: background .15s, opacity .15s;
    position: relative;
  }
  tbody tr:hover { background: rgba(0,255,174,0.025); }
  tbody tr.dragging { opacity: 0.35; }
  tbody tr.drag-over-top    { box-shadow: inset 0 2px 0 var(--accent); }
  tbody tr.drag-over-bottom { box-shadow: inset 0 -2px 0 var(--accent); }

  tbody td {
    padding: 18px 16px; text-align: right;
    font-size: 14px; font-variant-numeric: tabular-nums;
  }
  tbody td:first-child { padding-left: 24px; text-align: left; }
  tbody td:last-child { padding-right: 24px; }

  .asset { display: flex; align-items: center; gap: 12px; }
  .drag-handle {
    cursor: grab; color: var(--text-faint); font-size: 14px;
    padding: 4px 6px; user-select: none; -webkit-user-select: none;
    transition: color .15s; flex-shrink: 0;
  }
  .drag-handle:hover { color: var(--accent); }
  .drag-handle:active { cursor: grabbing; }
  .asset .logo {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg-1); border: 1px solid var(--line-bright);
    object-fit: cover; flex-shrink: 0;
  }
  .asset .logo-fallback {
    width: 36px; height: 36px;
    background: var(--bg-1); border: 1px solid var(--line-bright);
    display: grid; place-items: center;
    font-size: 10px; font-weight: 700; color: var(--accent);
    letter-spacing: 0.05em; flex-shrink: 0;
  }
  .asset .logo-fallback.crypto { color: var(--gold); border-color: rgba(247,185,85,0.3); }
  .asset .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .asset .sym { font-size: 16px; font-weight: 700; letter-spacing: 0.05em; }
  .asset .sym.crypto { color: var(--gold); }
  .asset .name { font-size: 11px; color: var(--text-faint); letter-spacing: 0.05em;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .price { font-size: 18px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .pct {
    font-weight: 600; padding: 5px 12px; display: inline-block;
    min-width: 90px; text-align: right;
    border: 1px solid transparent; font-size: 13px; white-space: nowrap;
  }
  .pct.up   { color: var(--accent); border-color: rgba(0,255,174,0.25); background: rgba(0,255,174,0.06); }
  .pct.down { color: var(--warn);   border-color: rgba(255,82,119,0.25); background: rgba(255,82,119,0.06); }
  .pct.flat { color: var(--text-dim); }

  /* Sparkline column */
  .th-spark { text-align: center !important; padding-left: 8px !important; padding-right: 8px !important; }
  .spark-cell { text-align: center; padding-left: 8px !important; padding-right: 8px !important; }
  .spark {
    display: inline-block;
    width: 90px; height: 28px;
    vertical-align: middle;
    opacity: 0.85;
  }
  .spark-empty {
    display: inline-block;
    color: var(--text-faint); font-size: 10px;
    letter-spacing: 0.15em;
  }

  /* Chat ping — gentle flash on the chat panel header when a new message
     arrives while user is viewing the news tab. */
  .panel-head.ping {
    animation: chatPing 1.4s ease-in-out 2;
  }
  @keyframes chatPing {
    0%, 100% { background: rgba(0,0,0,0.3); }
    50%      { background: rgba(0,255,174,0.18); }
  }

  .del {
    background: transparent; border: 1px solid var(--line-bright);
    color: var(--text-faint); padding: 6px 10px; cursor: pointer;
    font-family: inherit; font-size: 11px; transition: all .15s;
    -webkit-appearance: none; appearance: none; border-radius: 0;
    min-height: 36px;
  }
  .del:hover { color: var(--warn); border-color: var(--warn); background: rgba(255,82,119,0.08); }

  .empty { padding: 80px 40px; text-align: center; color: var(--text-dim); }
  .empty h3 { font-family: 'Space Grotesk', sans-serif; color: var(--text);
              letter-spacing: 0.2em; font-size: 16px; margin: 0 0 8px; }
  .empty p { font-size: 12px; color: var(--text-faint); letter-spacing: 0.05em; }
  .empty.hidden { display: none; }

  /* News view */
  .news-section { padding: 24px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
  }
  .section-head .label {
    font-size: 11px; letter-spacing: 0.3em;
    color: var(--accent); text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .section-head .label::before {
    content:""; width: 6px; height: 6px;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
  }
  .section-head .updated {
    font-size: 10px; letter-spacing: 0.2em;
    color: var(--text-faint); text-transform: uppercase;
  }

  .news-list {
    display: flex; flex-direction: column;
    border: 1px solid var(--line);
    background: rgba(10,14,26,0.5);
    backdrop-filter: blur(8px);
  }
  .news-item {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    display: flex; gap: 18px; align-items: flex-start;
    text-decoration: none; color: inherit;
    transition: background .15s;
  }
  .news-item:last-child { border-bottom: none; }
  .news-item:hover { background: rgba(0,255,174,0.04); }
  .news-item .num {
    font-size: 11px; letter-spacing: 0.2em;
    color: var(--text-faint); font-weight: 700;
    min-width: 30px; padding-top: 4px;
  }
  .news-item .body { flex: 1; min-width: 0; }
  .news-item .ticker-tag {
    display: inline-block;
    font-size: 9px; letter-spacing: 0.2em;
    color: var(--accent);
    border: 1px solid rgba(0,255,174,0.3);
    padding: 2px 8px; margin-bottom: 8px;
    text-transform: uppercase;
  }
  .news-item .headline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; line-height: 1.45;
    color: var(--text); font-weight: 500;
    margin-bottom: 8px;
  }
  .news-item:hover .headline { color: var(--accent); }
  .news-item .summary {
    font-size: 12px; line-height: 1.55;
    color: var(--text-dim); margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-item .meta {
    display: flex; gap: 12px; align-items: center;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--text-faint); text-transform: uppercase;
  }
  .news-item .meta .source { color: var(--text-dim); font-weight: 600; }
  .news-item .meta .dot { width: 3px; height: 3px; background: var(--text-faint); border-radius: 50%; }

  .news-loading, .news-error {
    padding: 60px 20px; text-align: center;
    color: var(--text-faint);
    font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* ============ MOBILE ============ */
  @media (max-width: 768px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: 50px 50vh 1fr;
      grid-template-rows: 50px 50dvh 1fr;
      height: auto; min-height: 100vh; min-height: 100dvh;
    }
    body { overflow: auto; }
    .view { overflow: visible; }

    .topbar { padding: 0 12px; gap: 10px; height: 50px; }
    .top-stats { display: none; }
    .brand .name { font-size: 15px; letter-spacing: 0.12em; }
    .brand .orb { width: 22px; height: 22px; }
    .toggle-btn { font-size: 13px; padding: 4px 10px; letter-spacing: 0.12em; }
    .lock-btn { padding: 5px 8px; font-size: 11px; }
    .right-cluster { gap: 8px; }

    .chat { border-right: none; border-bottom: 1px solid var(--line); }
    .panel-head { height: 38px; min-height: 38px; padding: 0 14px; font-size: 9px; }
    .messages { padding: 12px; gap: 10px; }
    .msg { padding: 6px 0 6px 12px; padding-right: 30px; }
    .msg .h { font-size: 11px; gap: 8px; margin-bottom: 3px; }
    .msg .body { font-size: 14px; line-height: 1.45; }
    .msg .x { opacity: 0.7; font-size: 16px; padding: 8px; top: 4px; right: 0; }
    .composer { padding: 10px; gap: 8px; }
    .composer input { padding: 12px 14px; }

    .toolbar { padding: 12px; gap: 10px; }
    .search-wrap input { padding: 12px 14px 12px 36px; }
    .search-wrap input::placeholder { font-size: 13px; }

    thead th { padding: 10px 8px; font-size: 9px; letter-spacing: 0.15em; }
    thead th:first-child { padding-left: 12px; }
    thead th:last-child { padding-right: 12px; }
    tbody td { padding: 14px 8px; font-size: 13px; }
    tbody td:first-child { padding-left: 12px; }
    tbody td:last-child { padding-right: 12px; }

    .drag-handle { display: none; }
    .asset { gap: 10px; }
    .asset .logo, .asset .logo-fallback { width: 32px; height: 32px; }
    .asset .sym { font-size: 14px; }
    .asset .name { font-size: 10px; max-width: 100px; }
    .price { font-size: 15px; }
    .pct { font-size: 12px; padding: 4px 8px; min-width: 70px; }
    /* Hide sparkline on phones — too cramped */
    .th-spark, .spark-cell { display: none !important; }

    .news-section { padding: 14px; }
    .news-item { padding: 14px; gap: 12px; }
    .news-item .num { min-width: 22px; font-size: 9px; }
    .news-item .headline { font-size: 14px; }
    .news-item .summary { display: none; }
    .news-item .meta { font-size: 9px; gap: 8px; flex-wrap: wrap; }
  }
  @media (max-width: 380px) {
    .asset .name { display: none; }
    tbody td { padding: 12px 6px; }
    .pct { min-width: 60px; padding: 3px 6px; font-size: 11px; }
  }
</style>
</head>
<body>

<div class="glow tl"></div>
<div class="glow br"></div>

<div class="app">

  <header class="topbar">
    <a class="brand" href="index.html">
      <div class="orb"></div>
      <div><div class="name">WORLD<span>VEST</span></div></div>
    </a>
    <div class="top-stats">
      <div class="stat"><span>FEED</span><b id="feed-status" class="live">LIVE</b></div>
      <div class="stat"><span>SYMBOLS</span><b id="stat-symbols">0</b></div>
      <div class="stat"><span>LAST SYNC</span><b id="stat-sync">—</b></div>
    </div>
    <div class="right-cluster">
      <button class="toggle-btn" id="toggle-btn" onclick="toggleView()">NEWS<span>FEED</span></button>
      <button class="lock-btn" onclick="logout()" title="Sign out"><i class="fa-solid fa-lock"></i></button>
    </div>
  </header>

  <aside class="chat">
    <div class="panel-head">
      <span class="tag">CHAT BOARD</span>
      <span id="chat-count">0 MSG</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="username" placeholder="Name" maxlength="24" />
      <div class="row">
        <input id="chat-input" placeholder="Message" maxlength="500"
               onkeypress="if(event.key==='Enter') sendMessage()" />
        <button class="btn" onclick="sendMessage()">SEND</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <!-- Watchlist toolbar (only visible on watchlist view) -->
    <div class="toolbar" id="toolbar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass icon"></i>
        <input id="search" placeholder="search · stocks (AAPL) · crypto (BTC, ETH, SOL)"
               onkeyup="handleSearchInput()" onfocus="handleSearchInput()"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <div id="suggestions" class="hidden"></div>
      </div>
    </div>

    <!-- Watchlist view -->
    <div class="view" id="watchlist-view">
      <table>
        <thead>
          <tr>
            <th>Asset</th>
            <th>Price</th>
            <th class="th-spark">7D</th>
            <th>1D %</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="watchlist-body"></tbody>
      </table>
      <div id="empty-state" class="empty hidden">
        <h3>NO ASSETS TRACKED</h3>
        <p>Search a ticker above and pick one to start tracking.</p>
      </div>
    </div>

    <!-- News view -->
    <div class="view hidden" id="news-view">
      <div class="news-section">
        <div class="section-head">
          <span class="label">Markets News</span>
          <span class="updated" id="news-updated">—</span>
        </div>
        <div class="news-list" id="news-list">
          <div class="news-loading">Loading headlines…</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  // ============ GATE CHECK ============
  if (localStorage.getItem("worldvest_unlocked") !== "true") {
    window.location.replace("index.html");
  }

  // ============ CONFIG ============
  const firebaseConfig = {
    apiKey: "AIzaSyBZar3sZBOEe__EGqh_IqTszD8CzeKJYYY",
    authDomain: "watchlist-d9ade.firebaseapp.com",
    projectId: "watchlist-d9ade",
    storageBucket: "watchlist-d9ade.firebasestorage.app",
    messagingSenderId: "927853955548",
    appId: "1:927853955548:web:dedd485e291d3804542719",
    measurementId: "G-9QNQ8ZVLSR"
  };
  const FINNHUB_KEY = "d7ok9vhr01qsb7bf9bdgd7ok9vhr01qsb7bf9be0";
  const STALE_THRESHOLD_MS = 2 * 60 * 1000;
  const RECOVERY_INTERVAL_MS = 60 * 1000;

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  firebase.auth().signInAnonymously().catch(err => console.warn('auth failed:', err));

  // ============ STATE ============
  let watchlist = {};
  let prices = {};
  let historical = {}; // { SYMBOL: [{t, p}, ...] sorted by t asc }
  let chatCount = 0;
  let currentView = 'watchlist'; // 'watchlist' | 'news'

  // ============ HELPERS ============
  const isCrypto = sym => sym.startsWith('CG:') || sym.includes(':');
  function prettySymbol(symbol, fallbackName) {
    if (fallbackName) return fallbackName;
    if (symbol.startsWith('CG:')) return symbol.slice(3).toUpperCase();
    if (symbol.includes(':')) {
      const pair = symbol.split(':')[1] || '';
      return pair.replace(/USDT$|USD$|USDC$|BUSD$/i, '');
    }
    return symbol;
  }
  const fmtPrice = v => {
    if (v == null || isNaN(v)) return '—';
    const n = Number(v);
    const decimals = n < 1 ? 6 : 2;
    return n.toLocaleString(undefined, {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
  };
  const fmtPct = v => {
    if (v == null || isNaN(v)) return '—';
    const n = Number(v);
    return (n>=0?'+':'') + n.toFixed(2) + '%';
  };
  const dirClass = v => {
    if (v == null || isNaN(v)) return 'flat';
    if (v > 0.001) return 'up';
    if (v < -0.001) return 'down';
    return 'flat';
  };
  const ago = ts => {
    if (!ts) return '—';
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    return Math.floor(s/3600) + 'h ago';
  };
  const safe = s => String(s||'').replace(/[<>&"']/g, c => ({
    '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'
  }[c]));

  function sortedSymbols() {
    return Object.keys(watchlist).sort((a,b) => {
      const oa = watchlist[a].order ?? watchlist[a].addedAt ?? 0;
      const ob = watchlist[b].order ?? watchlist[b].addedAt ?? 0;
      return oa - ob;
    });
  }

  // ============ SPARKLINE ============
  // Build a simple SVG polyline for a 7-day price series.
  // Color: green if last >= first, red if down. Renders nothing if <2 points.
  function sparklineSvg(symbol) {
    const series = historical[symbol];
    if (!Array.isArray(series) || series.length < 2) {
      return '<span class="spark-empty">—</span>';
    }
    const W = 90, H = 28, PAD = 2;
    const prices = series.map(s => s.p).filter(Number.isFinite);
    if (prices.length < 2) return '<span class="spark-empty">—</span>';

    const min = Math.min(...prices);
    const max = Math.max(...prices);
    const range = max - min || 1; // avoid divide-by-zero on flat series
    const stepX = (W - PAD * 2) / (prices.length - 1);

    const pts = prices.map((p, i) => {
      const x = PAD + i * stepX;
      const y = H - PAD - ((p - min) / range) * (H - PAD * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    const up = prices[prices.length - 1] >= prices[0];
    const stroke = up ? 'var(--accent)' : 'var(--warn)';
    const fill = up ? 'rgba(0,255,174,0.10)' : 'rgba(255,82,119,0.10)';

    // Build a closed area shape underneath the line for subtle fill
    const areaPts = `${PAD},${H - PAD} ${pts} ${(W - PAD).toFixed(1)},${H - PAD}`;

    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polygon points="${areaPts}" fill="${fill}" stroke="none" />
      <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
    </svg>`;
  }

  // ============ VIEW TOGGLE ============
  function toggleView() {
    currentView = currentView === 'watchlist' ? 'news' : 'watchlist';
    applyView();
    if (currentView === 'news') loadNews();
    // Update URL hash so refresh keeps the view
    history.replaceState(null, '', currentView === 'news' ? '#news' : '#watchlist');
  }

  function applyView() {
    const watchlistView = document.getElementById('watchlist-view');
    const newsView = document.getElementById('news-view');
    const toolbar = document.getElementById('toolbar');
    const toggleBtn = document.getElementById('toggle-btn');

    if (currentView === 'watchlist') {
      watchlistView.classList.remove('hidden');
      newsView.classList.add('hidden');
      toolbar.classList.remove('hidden');
      toggleBtn.innerHTML = 'NEWS<span>FEED</span>';
    } else {
      watchlistView.classList.add('hidden');
      newsView.classList.remove('hidden');
      toolbar.classList.add('hidden');
      toggleBtn.innerHTML = 'WATCH<span>LIST</span>';
    }
  }

  // Honor URL hash on first load
  if (window.location.hash === '#news') {
    currentView = 'news';
  }
  applyView();

  // ============ FRESHNESS INDICATOR ============
  function mostRecentUpdate() {
    let m = 0;
    Object.values(prices).forEach(p => {
      if (p && p.updatedAt && p.updatedAt > m) m = p.updatedAt;
    });
    return m;
  }
  function updateFeedStatus() {
    const ts = mostRecentUpdate();
    const syncEl = document.getElementById('stat-sync');
    const feedEl = document.getElementById('feed-status');
    if (syncEl) syncEl.textContent = ts ? ago(ts) : '—';
    if (feedEl) {
      const stale = ts && (Date.now() - ts) > STALE_THRESHOLD_MS;
      feedEl.classList.toggle('stale', !!stale);
      feedEl.textContent = stale ? 'STALE' : 'LIVE';
    }
  }

  // ============ WATCHLIST RENDER ============
  function renderWatchlist() {
    const tbody = document.getElementById('watchlist-body');
    const empty = document.getElementById('empty-state');
    const symbols = sortedSymbols();

    document.getElementById('stat-symbols').textContent = symbols.length;

    if (symbols.length === 0) {
      tbody.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    updateFeedStatus();

    const html = symbols.map(sym => {
      const w = watchlist[sym] || {};
      const p = prices[sym] || {};
      const crypto = isCrypto(sym);
      const display = prettySymbol(sym, w.tickerLabel);
      const logo = w.logoUrl
        ? `<img class="logo" src="${safe(w.logoUrl)}" onerror="this.outerHTML='<div class=\\'logo-fallback ${crypto?'crypto':''}\\'>${safe(display).slice(0,4)}</div>'" />`
        : `<div class="logo-fallback ${crypto ? 'crypto' : ''}">${safe(display).slice(0,4)}</div>`;
      return `
        <tr data-sym="${safe(sym)}" draggable="true">
          <td>
            <div class="asset">
              <span class="drag-handle" title="Drag to reorder"><i class="fa-solid fa-grip-vertical"></i></span>
              ${logo}
              <div class="meta">
                <div class="sym ${crypto ? 'crypto' : ''}">${safe(display)}</div>
                ${w.name ? `<div class="name">${safe(w.name)}</div>` : ''}
              </div>
            </div>
          </td>
          <td><span class="price">${fmtPrice(p.price)}</span></td>
          <td class="spark-cell">${sparklineSvg(sym)}</td>
          <td><span class="pct ${dirClass(p.percent)}">${fmtPct(p.percent)}</span></td>
          <td><button class="del" onclick="deleteTicker('${safe(sym)}')"><i class="fa-solid fa-trash"></i></button></td>
        </tr>`;
    }).join('');
    tbody.innerHTML = html;
    attachDragHandlers();
  }

  function updatePricesInPlace() {
    const tbody = document.getElementById('watchlist-body');
    if (!tbody) return false;
    const rows = tbody.querySelectorAll('tr[data-sym]');
    if (rows.length !== Object.keys(watchlist).length) return false;
    for (const row of rows) {
      const sym = row.dataset.sym;
      const p = prices[sym] || {};
      const priceEl = row.querySelector('.price');
      const pctEl = row.querySelector('.pct');
      const sparkCell = row.querySelector('.spark-cell');
      if (priceEl) priceEl.textContent = fmtPrice(p.price);
      if (pctEl) {
        pctEl.textContent = fmtPct(p.percent);
        pctEl.className = 'pct ' + dirClass(p.percent);
      }
      if (sparkCell) sparkCell.innerHTML = sparklineSvg(sym);
    }
    updateFeedStatus();
    return true;
  }

  // ============ DRAG & DROP (desktop only) ============
  let dragSym = null;
  function attachDragHandlers() {
    if (window.matchMedia('(max-width: 768px)').matches) return;
    document.querySelectorAll('#watchlist-body tr').forEach(row => {
      row.addEventListener('dragstart', e => {
        dragSym = row.dataset.sym;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', dragSym); } catch (_) {}
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        document.querySelectorAll('#watchlist-body tr').forEach(r => {
          r.classList.remove('drag-over-top','drag-over-bottom');
        });
        dragSym = null;
      });
      row.addEventListener('dragover', e => {
        e.preventDefault();
        if (!dragSym || row.dataset.sym === dragSym) return;
        const rect = row.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        row.classList.toggle('drag-over-top', before);
        row.classList.toggle('drag-over-bottom', !before);
      });
      row.addEventListener('dragleave', () => {
        row.classList.remove('drag-over-top','drag-over-bottom');
      });
      row.addEventListener('drop', e => {
        e.preventDefault();
        if (!dragSym || row.dataset.sym === dragSym) return;
        const rect = row.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        reorderSymbols(dragSym, row.dataset.sym, before);
      });
    });
  }
  function reorderSymbols(movedSym, targetSym, dropBefore) {
    const order = sortedSymbols();
    const fromIdx = order.indexOf(movedSym);
    if (fromIdx === -1) return;
    order.splice(fromIdx, 1);
    let toIdx = order.indexOf(targetSym);
    if (toIdx === -1) return;
    if (!dropBefore) toIdx += 1;
    order.splice(toIdx, 0, movedSym);
    const updates = {};
    order.forEach((sym, i) => {
      updates[`watchlist/${sym}/order`] = (i + 1) * 1000;
    });
    db.ref().update(updates);
  }

  // ============ FIREBASE LISTENERS ============
  db.ref('watchlist').on('value', snap => {
    watchlist = snap.val() || {};
    renderWatchlist();
  });
  db.ref('prices').on('value', snap => {
    prices = snap.val() || {};
    if (!updatePricesInPlace()) renderWatchlist();
  });
  db.ref('historical').on('value', snap => {
    const raw = snap.val() || {};
    // raw[symbol] is an object of {pushKey: {t, p}}. Convert to sorted array.
    const out = {};
    for (const sym of Object.keys(raw)) {
      const entries = Object.values(raw[sym] || {});
      entries.sort((a, b) => (a.t || 0) - (b.t || 0));
      out[sym] = entries;
    }
    historical = out;
    if (!updatePricesInPlace()) renderWatchlist();
  });

  // Recovery polling (catches stalled listeners)
  setInterval(async () => {
    try {
      const snap = await db.ref('prices').once('value');
      const fresh = snap.val() || {};
      const freshTs = Object.values(fresh).reduce((m, p) => Math.max(m, p?.updatedAt || 0), 0);
      const currentTs = mostRecentUpdate();
      if (freshTs > currentTs) {
        prices = fresh;
        if (!updatePricesInPlace()) renderWatchlist();
      } else {
        updateFeedStatus();
      }
    } catch (e) { console.warn('recovery read failed:', e); }
  }, RECOVERY_INTERVAL_MS);
  setInterval(updateFeedStatus, 10000);

  // Visibility recovery — refetch when tab becomes visible again
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      clearUnread();
      try {
        const [wlSnap, prSnap] = await Promise.all([
          db.ref('watchlist').once('value'),
          db.ref('prices').once('value'),
        ]);
        watchlist = wlSnap.val() || {};
        prices = prSnap.val() || {};
        renderWatchlist();
        if (currentView === 'news') loadNews();
      } catch (e) { console.warn('visibility refetch failed:', e); }
    }
  });

  // ============ CHAT ============
  // Track unread count for tab title pings. Cleared when user views chat.
  let unreadCount = 0;
  let initialChatLoad = true; // skip pings on initial backfill of last 100 msgs
  const ORIGINAL_TITLE = document.title;

  function updateTabTitle() {
    document.title = unreadCount > 0
      ? `(${unreadCount}) ${ORIGINAL_TITLE} 💬`
      : ORIGINAL_TITLE;
  }

  function clearUnread() {
    if (unreadCount === 0) return;
    unreadCount = 0;
    updateTabTitle();
  }

  function pingChat() {
    // Visual flash on chat header — only meaningful when user is on news tab,
    // since chat is offscreen there. (On watchlist view they can already see it.)
    if (currentView === 'news') {
      const head = document.querySelector('.chat .panel-head');
      if (head) {
        head.classList.remove('ping');
        // Force reflow so animation re-triggers if pings stack quickly
        void head.offsetWidth;
        head.classList.add('ping');
        setTimeout(() => head.classList.remove('ping'), 3000);
      }
    }
    // Tab title ping — only when tab is in background
    if (document.visibilityState !== 'visible') {
      unreadCount++;
      updateTabTitle();
    }
  }

  db.ref('chat').limitToLast(100).on('child_added', snap => {
    const m = snap.val(), key = snap.key;
    if (!m) return;
    const time = new Date(m.timestamp || Date.now()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const div = document.createElement('div');
    div.className = 'msg'; div.dataset.key = key;
    div.innerHTML = `
      <button class="x" title="Delete message" onclick="deleteMessage('${key}')">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="h">
        <span class="who">${safe(m.name) || 'ANON'}</span>
        <span>${time}</span>
      </div>
      <div class="body">${safe(m.message)}</div>`;
    const box = document.getElementById('messages');
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    chatCount++;
    document.getElementById('chat-count').textContent = chatCount + ' MSG';

    // Ping for genuinely new messages, not the historical backfill
    if (!initialChatLoad) pingChat();
  });
  // After Firebase delivers the initial batch, future child_added events
  // are real new messages. Use a microtask to flip the flag right after.
  db.ref('chat').limitToLast(100).once('value').then(() => {
    initialChatLoad = false;
  });

  db.ref('chat').on('child_removed', snap => {
    const node = document.querySelector(`.msg[data-key="${snap.key}"]`);
    if (node) node.remove();
    chatCount = Math.max(0, chatCount - 1);
    document.getElementById('chat-count').textContent = chatCount + ' MSG';
  });

  // ============ ACTIONS ============
  function addToWatchlist(symbol, meta) {
    if (!symbol || watchlist[symbol]) return;
    const existing = sortedSymbols();
    const firstOrder = existing.length
      ? (watchlist[existing[0]].order ?? 1000) : 1000;
    db.ref('watchlist/' + symbol).set({
      symbol,
      tickerLabel: meta.tickerLabel || symbol,
      name: meta.name || '',
      logoUrl: meta.logoUrl || '',
      addedAt: Date.now(),
      order: firstOrder - 1000,
    });
    document.getElementById('search').value = '';
    document.getElementById('suggestions').classList.add('hidden');
  }
  function deleteTicker(symbol) {
    const display = prettySymbol(symbol, watchlist[symbol]?.tickerLabel);
    if (!confirm(`Remove ${display} from watchlist?`)) return;
    db.ref('watchlist/' + symbol).remove();
    db.ref('prices/' + symbol).remove();
  }
  function deleteMessage(key) { db.ref('chat/' + key).remove(); }
  function sendMessage() {
    const input = document.getElementById('chat-input');
    const nameInput = document.getElementById('username');
    const msg = input.value.trim();
    if (!msg) return;
    db.ref('chat').push({
      name: (nameInput.value.trim() || 'ANON').slice(0,24),
      message: msg.slice(0,500),
      timestamp: Date.now()
    });
    input.value = '';
    clearUnread();
  }
  function logout() {
    if (!confirm('Sign out and return to the landing page?')) return;
    localStorage.removeItem('worldvest_unlocked');
    window.location.replace('index.html');
  }

  // ============ TICKER SEARCH ============
  let searchTimer = null;
  function handleSearchInput() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(doSearch, 250);
  }
  async function searchStocks(q) {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/search?q=${encodeURIComponent(q)}&token=${FINNHUB_KEY}`);
      const data = await res.json();
      return (data.result || [])
        .filter(it => it.type && (it.type.includes('Common') || it.type === 'ETP' || it.type === 'Equity'))
        .slice(0, 8)
        .map(it => ({
          symbol: it.symbol,
          tickerLabel: it.symbol,
          name: it.description || '',
          logoUrl: `https://logos.allinvestview.com/ticker/${encodeURIComponent(it.symbol)}.png`,
        }));
    } catch (e) { return []; }
  }
  async function searchCrypto(q) {
    try {
      const res = await fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(q)}`);
      const data = await res.json();
      return (data.coins || []).slice(0, 8).map(c => ({
        symbol: 'CG:' + c.id,
        tickerLabel: (c.symbol || '').toUpperCase(),
        name: c.name,
        logoUrl: c.thumb || c.large || '',
      }));
    } catch (e) { return []; }
  }
  async function doSearch() {
    const q = document.getElementById('search').value.trim();
    const box = document.getElementById('suggestions');
    if (q.length < 1) { box.classList.add('hidden'); return; }
    const [stocks, crypto] = await Promise.all([searchStocks(q), searchCrypto(q)]);
    if (stocks.length === 0 && crypto.length === 0) { box.classList.add('hidden'); return; }
    let html = '';
    if (stocks.length) {
      html += `<div class="sug-section">STOCKS</div>`;
      html += stocks.map(s => {
        const meta = encodeURIComponent(JSON.stringify(s));
        return `<div class="sug" onclick="pickResult('${meta}')">
          <span class="sym">${safe(s.symbol)}</span>
          <span class="desc">${safe(s.name)}</span>
        </div>`;
      }).join('');
    }
    if (crypto.length) {
      html += `<div class="sug-section">CRYPTO</div>`;
      html += crypto.map(c => {
        const meta = encodeURIComponent(JSON.stringify(c));
        const logo = c.logoUrl ? `<img class="logo" src="${safe(c.logoUrl)}" onerror="this.style.display='none'" />` : '';
        return `<div class="sug crypto" onclick="pickResult('${meta}')">
          ${logo}
          <span class="sym">${safe(c.tickerLabel)}</span>
          <span class="desc">${safe(c.name)}</span>
          <span class="pill">CRYPTO</span>
        </div>`;
      }).join('');
    }
    box.innerHTML = html;
    box.classList.remove('hidden');
  }
  function pickResult(encodedMeta) {
    try {
      const meta = JSON.parse(decodeURIComponent(encodedMeta));
      addToWatchlist(meta.symbol, meta);
    } catch (e) { console.warn('pickResult failed:', e); }
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) {
      document.getElementById('suggestions').classList.add('hidden');
    }
  });

  // Clear unread when user is clearly engaging with the chat
  document.getElementById('chat-input').addEventListener('focus', clearUnread);
  document.getElementById('messages').addEventListener('scroll', clearUnread, { passive: true });
  document.querySelector('.chat').addEventListener('click', clearUnread);

  // ============ NEWS ============
  // Mix general market news with per-watchlist-stock news, sorted by recency.
  let newsLastLoadedAt = 0;
  const NEWS_CACHE_MS = 2 * 60 * 1000; // don't re-fetch more than every 2 min

  async function fetchGeneralNews() {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/news?category=general&token=${FINNHUB_KEY}`);
      if (!res.ok) return [];
      const items = await res.json();
      return (items || []).filter(it => it.headline && it.headline.trim().length > 0);
    } catch (e) { return []; }
  }
  async function fetchWatchlistNews() {
    const stockSyms = Object.keys(watchlist).filter(s => !isCrypto(s));
    if (stockSyms.length === 0) return [];
    const today = new Date();
    const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
    const fmt = d => d.toISOString().slice(0,10);
    const fromDate = fmt(weekAgo), toDate = fmt(today);

    const results = await Promise.all(stockSyms.map(async sym => {
      try {
        const res = await fetch(`https://finnhub.io/api/v1/company-news?symbol=${encodeURIComponent(sym)}&from=${fromDate}&to=${toDate}&token=${FINNHUB_KEY}`);
        if (!res.ok) return [];
        const items = await res.json();
        const top = (items || [])
          .filter(it => it.headline && it.headline.trim().length > 0)
          .sort((a,b) => (b.datetime||0) - (a.datetime||0))
          .slice(0, 2);
        return top.map(it => ({ ...it, _sym: sym }));
      } catch (e) { return []; }
    }));
    return results.flat();
  }

  async function loadNews(force = false) {
    if (!force && Date.now() - newsLastLoadedAt < NEWS_CACHE_MS) return;
    const listEl = document.getElementById('news-list');
    const updatedEl = document.getElementById('news-updated');

    try {
      const [general, watchlistNews] = await Promise.all([
        fetchGeneralNews(),
        fetchWatchlistNews(),
      ]);
      // Combine, sort by recency, dedupe by URL
      const combined = [...general, ...watchlistNews];
      const seen = new Set();
      const unique = combined.filter(it => {
        if (!it.url || seen.has(it.url)) return false;
        seen.add(it.url);
        return true;
      });
      unique.sort((a,b) => (b.datetime||0) - (a.datetime||0));
      const top = unique.slice(0, 20);

      if (top.length === 0) {
        listEl.innerHTML = '<div class="news-error">No headlines available right now.</div>';
        return;
      }

      listEl.innerHTML = top.map((it, i) => {
        const tickerBadge = it._sym ? `<div class="ticker-tag">${safe(it._sym)}</div>` : '';
        const summary = it.summary && it.summary.length > 30
          ? `<div class="summary">${safe(it.summary)}</div>` : '';
        const ageStr = it.datetime
          ? (() => {
              const diff = Math.floor(Date.now()/1000 - it.datetime);
              if (diff < 60) return 'just now';
              if (diff < 3600) return Math.floor(diff/60) + 'm ago';
              if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
              return Math.floor(diff/86400) + 'd ago';
            })()
          : '';
        return `
          <a class="news-item" href="${safe(it.url)}" target="_blank" rel="noopener noreferrer">
            <div class="num">${String(i+1).padStart(2,'0')}</div>
            <div class="body">
              ${tickerBadge}
              <div class="headline">${safe(it.headline)}</div>
              ${summary}
              <div class="meta">
                <span class="source">${safe(it.source || 'Source')}</span>
                <span class="dot"></span>
                <span>${ageStr}</span>
              </div>
            </div>
          </a>`;
      }).join('');
      newsLastLoadedAt = Date.now();
      updatedEl.textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    } catch (e) {
      console.warn('news load failed:', e);
      listEl.innerHTML = '<div class="news-error">Couldn\'t load headlines.</div>';
    }
  }

  // If the page loaded directly to news view, load immediately
  if (currentView === 'news') loadNews(true);
  // Refresh news every 5 min if we're on the news view
  setInterval(() => { if (currentView === 'news') loadNews(true); }, 5 * 60 * 1000);
</script>
</body>
